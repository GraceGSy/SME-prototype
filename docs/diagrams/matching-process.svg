<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1120" viewBox="0 0 1130 1120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs>
<rect width="1130" height="1120" fill="#ffffff"/>
<text x="70" y="58" font-size="27" font-weight="700" fill="#1f2328" text-anchor="start" >How a new document joins the graph</text>
<text x="70" y="86" font-size="15" font-weight="400" fill="#5b6470" text-anchor="start" >One procedure for every level: first sections, then paragraphs inside each matched section group.</text>
<circle cx="77" cy="114" r="7" fill="#6b4fa0"/>
<text x="91" y="119" font-size="13.5" font-weight="400" fill="#5b6470" text-anchor="start" >Jev judges</text>
<circle cx="197" cy="114" r="7" fill="#b4621a"/>
<text x="211" y="119" font-size="13.5" font-weight="400" fill="#5b6470" text-anchor="start" >Claude writes</text>
<circle cx="341" cy="114" r="7" fill="#2f6e45"/>
<text x="355" y="119" font-size="13.5" font-weight="400" fill="#5b6470" text-anchor="start" >Fixed rule in code</text>
<rect x="70" y="138" width="1020" height="62" rx="12" fill="#f6f7f9" stroke="#d5dae1"/>
<text x="90" y="165" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="start" >Documents 1 and 2</text>
<text x="90" y="187" font-size="13.5" font-weight="400" fill="#5b6470" text-anchor="start" >Document 1 seeds the graph: each unit starts its own group.  Document 2 skips steps 2 and 3: Jev reads both documents whole and picks directly.</text>
<text x="70" y="236" font-size="12.5" font-weight="700" fill="#5b6470" text-anchor="start" letter-spacing="1.4">FOR EACH NEW UNIT  ·  DOCUMENT 3 ON</text>
<rect x="70" y="250" width="225" height="172" rx="12" fill="#edf6f0" stroke="#2f6e45" stroke-opacity="0.45" stroke-width="1.3"/>
<circle cx="100" cy="281" r="13" fill="#2f6e45"/>
<text x="100" y="286" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="122" y="287" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Candidates</text>
<text x="88" y="316" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >Every group at this level</text>
<text x="88" y="336" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >inside the same parent</text>
<text x="88" y="356" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >group as the unit.</text>
<rect x="88" y="386" width="151.6" height="24" rx="12" fill="#fff" stroke="#2f6e45" stroke-opacity="0.6"/>
<text x="163.8" y="402.5" font-size="12.5" font-weight="600" fill="#2f6e45" text-anchor="middle" >all groups, e.g. 40</text>
<rect x="335" y="250" width="225" height="172" rx="12" fill="#f4f0fb" stroke="#6b4fa0" stroke-opacity="0.45" stroke-width="1.3"/>
<circle cx="365" cy="281" r="13" fill="#6b4fa0"/>
<text x="365" y="286" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="387" y="287" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Shortlist</text>
<text x="353" y="316" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >Jev ranks every candidate</text>
<text x="353" y="336" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >in one long-context call</text>
<text x="353" y="356" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >and keeps the top 10.</text>
<rect x="353" y="386" width="85.0" height="24" rx="12" fill="#fff" stroke="#6b4fa0" stroke-opacity="0.6"/>
<text x="395.5" y="402.5" font-size="12.5" font-weight="600" fill="#6b4fa0" text-anchor="middle" >at most 10</text>
<rect x="600" y="250" width="225" height="172" rx="12" fill="#f4f0fb" stroke="#6b4fa0" stroke-opacity="0.45" stroke-width="1.3"/>
<circle cx="630" cy="281" r="13" fill="#6b4fa0"/>
<text x="630" y="286" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="652" y="287" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Yes / no</text>
<text x="618" y="316" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >One question per</text>
<text x="618" y="336" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >shortlisted group: does</text>
<text x="618" y="356" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >the unit play this role?</text>
<rect x="618" y="386" width="136.8" height="24" rx="12" fill="#fff" stroke="#6b4fa0" stroke-opacity="0.6"/>
<text x="686.4" y="402.5" font-size="12.5" font-weight="600" fill="#6b4fa0" text-anchor="middle" >the yeses, e.g. 3</text>
<rect x="865" y="250" width="225" height="172" rx="12" fill="#f4f0fb" stroke="#6b4fa0" stroke-opacity="0.45" stroke-width="1.3"/>
<circle cx="895" cy="281" r="13" fill="#6b4fa0"/>
<text x="895" y="286" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="917" y="287" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Pick</text>
<text x="883" y="316" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >Jev ranks the yeses.</text>
<text x="883" y="336" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >Top two within 0.10: ask</text>
<text x="883" y="356" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >again; still close: hold.</text>
<rect x="883" y="386" width="136.8" height="24" rx="12" fill="#fff" stroke="#6b4fa0" stroke-opacity="0.6"/>
<text x="951.4" y="402.5" font-size="12.5" font-weight="600" fill="#6b4fa0" text-anchor="middle" >one pick, or none</text>
<path d="M301,336.0 H329" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M566,336.0 H594" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M831,336.0 H859" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<text x="580" y="454" font-size="13.5" font-weight="400" fill="#5b6470" text-anchor="middle" font-style="italic">Asked both ways: the same yes/no answers also let each group pick among the new units that said yes to it.</text>
<path d="M580,468 V502" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<text x="70" y="522" font-size="12.5" font-weight="700" fill="#5b6470" text-anchor="start" letter-spacing="1.4">5  DECIDE  ·  FIXED RULES</text>
<rect x="70" y="536" width="326" height="142" rx="12" fill="#edf6f0" stroke="#2f6e45" stroke-opacity="0.45" stroke-width="1.3"/>
<text x="88" y="573" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Mutual match → join</text>
<text x="88" y="602" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >The unit and the group</text>
<text x="88" y="622" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >picked each other.</text>
<rect x="417" y="536" width="326" height="142" rx="12" fill="#edf6f0" stroke="#2f6e45" stroke-opacity="0.45" stroke-width="1.3"/>
<text x="435" y="573" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Fan-in → join</text>
<text x="435" y="602" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >A one-way pick joins when</text>
<text x="435" y="622" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >the unit&#x27;s neighbour in the</text>
<text x="435" y="642" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >same document joined that</text>
<text x="435" y="662" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >group mutually.</text>
<rect x="764" y="536" width="326" height="142" rx="12" fill="#edf6f0" stroke="#2f6e45" stroke-opacity="0.45" stroke-width="1.3"/>
<text x="782" y="573" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >No match → new group</text>
<text x="782" y="602" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >The unit starts a group</text>
<text x="782" y="622" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >of one. Step 6 may still</text>
<text x="782" y="642" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >place it later.</text>
<circle cx="298" cy="606" r="9" fill="#2c6280"/>
<rect x="348" y="593" width="34" height="26" rx="7" fill="#fff" stroke="#2f6e45" stroke-width="2"/>
<path d="M311,606 H343" stroke="#2f6e45" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/>
<circle cx="649" cy="586" r="9" fill="#2c6280"/>
<circle cx="649" cy="624" r="9" fill="#7b9bb0"/>
<path d="M649,596 V614" stroke="#7b9bb0" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="699" y="573" width="34" height="64" rx="8" fill="#fff" stroke="#2f6e45" stroke-width="2"/>
<path d="M662,586 H694" stroke="#2f6e45" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/>
<path d="M662,624 H694" stroke="#2f6e45" stroke-width="2" marker-end="url(#head)"/>
<text x="629" y="656" font-size="11" font-weight="400" fill="#5b6470" text-anchor="start" >neighbour</text>
<rect x="996" y="578" width="36" height="30" rx="8" fill="#fff" stroke="#2f6e45" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="1014" cy="593" r="9" fill="#2c6280"/>
<path d="M315,684 V718" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="70" y="724" width="490" height="118" rx="12" fill="#f4f0fb" stroke="#6b4fa0" stroke-opacity="0.45" stroke-width="1.3"/>
<circle cx="100" cy="755" r="13" fill="#6b4fa0"/>
<text x="100" y="760" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >6</text>
<text x="122" y="761" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Recover groups of one</text>
<text x="88" y="790" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >Each group of one repeats steps 2 to 5 against groups that</text>
<text x="88" y="810" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >already span documents, and joins on a mutual or fan-in match.</text>
<rect x="600" y="724" width="490" height="118" rx="12" fill="#fdf3e7" stroke="#b4621a" stroke-opacity="0.45" stroke-width="1.3"/>
<circle cx="630" cy="755" r="13" fill="#b4621a"/>
<text x="630" y="760" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >7</text>
<text x="652" y="761" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Rewrite group roles</text>
<text x="618" y="790" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >Claude rewrites the role statement of every group</text>
<text x="618" y="810" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start" >that changed.</text>
<path d="M566,783.0 H594" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M845,848 V894" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="70" y="900" width="1020" height="196" rx="14" fill="#eef4f8" stroke="#2c6280" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 5"/>
<circle cx="100" cy="932" r="13" fill="#2c6280"/>
<text x="100" y="937" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >8</text>
<text x="122" y="938" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >One level down: the same steps for paragraphs</text>
<rect x="96" y="962" width="330" height="116" rx="10" fill="#fff" stroke="#2c6280" stroke-opacity="0.5"/>
<text x="110" y="984" font-size="12.5" font-weight="700" fill="#2c6280" text-anchor="start" >Section group: Method</text>
<text x="112" y="1008" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="start" >Doc 1</text>
<rect x="112" y="1016" width="90" height="12" rx="4" fill="#8fb8d4"/>
<rect x="112" y="1034" width="90" height="12" rx="4" fill="#e3b37a"/>
<rect x="112" y="1052" width="90" height="12" rx="4" fill="#d7dbe0"/>
<text x="216" y="1008" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="start" >Doc 2</text>
<rect x="216" y="1016" width="90" height="12" rx="4" fill="#8fb8d4"/>
<rect x="216" y="1034" width="90" height="12" rx="4" fill="#e3b37a"/>
<text x="320" y="1008" font-size="11.5" font-weight="400" fill="#5b6470" text-anchor="start" >Doc 3</text>
<rect x="320" y="1016" width="90" height="12" rx="4" fill="#8fb8d4"/>
<rect x="320" y="1034" width="90" height="12" rx="4" fill="#d7dbe0"/>
<rect x="320" y="1052" width="90" height="12" rx="4" fill="#e3b37a"/>
<circle cx="460" cy="973" r="3" fill="#2c6280"/>
<text x="474" y="978" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Steps 1 to 7 run again on the new document&#x27;s paragraphs.</text>
<circle cx="460" cy="997" r="3" fill="#2c6280"/>
<text x="474" y="1002" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Candidates are only the paragraph groups inside the same section group.</text>
<circle cx="460" cy="1021" r="3" fill="#2c6280"/>
<text x="474" y="1026" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Base case: a one-paragraph section matched to a one-paragraph section</text>
<text x="474" y="1050" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >passes its match down; no question is asked.</text>
<circle cx="460" cy="1071" r="3" fill="#2c6280"/>
<text x="474" y="1076" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" >Same colour in the box = same paragraph group; grey = alone.</text>
<path d="M70,1020 H40 V336.0 H64" fill="none" stroke="#2c6280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#head)"/>
<text x="30" y="678.0" font-size="12.5" font-weight="600" fill="#2c6280" text-anchor="middle" transform="rotate(-90 30 678.0)">then for paragraphs</text>
</svg>