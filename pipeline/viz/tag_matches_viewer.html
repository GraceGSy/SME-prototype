        const section = sections.get(sectionId);
        currentSection = {
          id: sectionId,
          heading: section?.title || section?.tag || sectionId || "Unsectioned",
          paragraphs: [],
        };
        renderedSections.push(currentSection);
      }
      currentSection.paragraphs.push(`<article class="paper-map-paragraph${entry ? "" : " orphan"}" data-paper-map-paragraph="${escapeHtml(key)}" data-paper-map-group="${escapeHtml(groupId)}" style="${style}">
        <div class="paper-map-paragraph-meta"><button type="button" class="paragraph-id-button" data-paragraph-inspect="${escapeHtml(key)}">${escapeHtml(paragraph.id)}</button><span>${entry ? escapeHtml(entry.label) : "Unassigned"}</span></div>
        <div class="paper-map-paragraph-question">${escapeHtml(paragraph.tag || "(no question)")}</div>
        <div class="paper-map-paragraph-text">${escapeHtml(compactText(paragraph.text))}</div>
      </article>`);
    });
    const sectionHtml = renderedSections.map(section => `<section class="paper-map-section" data-paper-map-section="${escapeHtml(section.id)}">
      <div class="paper-map-section-head">${escapeHtml(section.heading)}</div>${section.paragraphs.join("")}
    </section>`).join("");
    return `<section class="paper-map-column" data-paper="${escapeHtml(paper.paper_id)}">
      <div class="paper-map-paper-head" title="${escapeHtml(paper.title)}">${escapeHtml(shortPaperLabel(paper))} · ${(paper.paragraphs || []).length} paragraphs</div>
      <div class="paper-map-filter-empty" hidden>No paragraphs in this paper answer the selected question.</div>${sectionHtml}
    </section>`;
  }).join("");
  return `<div class="paper-map-columns" style="--paper-count:${allPapers.length}">${columns}</div>`;
}

function renderPaperMapSkeleton(model) {
  const papers = allPapers.map(paper => {
    const blocks = (paper.paragraphs || []).map(paragraph => {
      const key = `${paper.paper_id}:${paragraph.id}`;
      const entry = model.assignments.get(key);
      const groupId = entry ? entry.group.group_id : "";
      const characterCount = Math.max(1, compactText(paragraph.text).length);
      const label = entry ? entry.label : "Unassigned";
      const style = `${entry ? `--group-color:${entry.color.border};` : ""}--paragraph-weight:${characterCount}`;
      const title = `${paragraph.id} · ${label} · ${characterCount.toLocaleString()} characters`;
      return `<button type="button" class="paper-map-skeleton-block${entry ? "" : " orphan"}" data-paper-map-paragraph="${escapeHtml(key)}" data-paragraph-inspect="${escapeHtml(key)}" data-paper-map-group="${escapeHtml(groupId)}" style="${style}" title="${escapeHtml(title)}" aria-label="${escapeHtml(`${shortPaperLabel(paper)} ${title}`)}"></button>`;
    }).join("");
    return `<section class="paper-map-skeleton-paper" data-paper="${escapeHtml(paper.paper_id)}">
      <div class="paper-map-paper-head" title="${escapeHtml(paper.title)}">${escapeHtml(shortPaperLabel(paper))} · ${(paper.paragraphs || []).length} paragraphs</div>
      <div class="paper-map-skeleton-frame"><div class="paper-map-skeleton-track">${blocks}</div></div>
    </section>`;
  }).join("");
  return `<div class="paper-map-skeleton-columns" style="--paper-count:${allPapers.length}">${papers}</div>`;
}

function updatePaperMapHeight() {
  const shell = stage.querySelector(".paper-map-shell");
  if (!shell) return;
  shell.style.height = `${Math.max(520, window.innerHeight - shell.getBoundingClientRect().top - 10)}px`;
}

function setPaperMapGroupEmphasis(hoveredGroupId = null) {
  const groupId = hoveredGroupId || paperMapSelectedGroupId;
  const active = Boolean(groupId);
  stage.querySelectorAll("[data-paper-map-group]").forEach(element => {
    const matches = element.dataset.paperMapGroup === groupId;
    element.classList.toggle("highlight", active && matches);
    element.classList.toggle("dim", active && !matches);
    if (element.classList.contains("paper-map-legend-item")) {
      const selected = element.dataset.paperMapGroup === paperMapSelectedGroupId;
      element.classList.toggle("selected", selected);
      element.setAttribute("aria-pressed", String(selected));
    }
    if (element.classList.contains("paper-map-skeleton-block")) {
      element.classList.toggle("selected", active && matches);
    }
  });
}

function applyPaperMapSelectionFilter() {
  const selectedGroupId = paperMapSelectedGroupId;
  const active = Boolean(selectedGroupId && paperMapHideUnselected);
  const filterToggle = document.getElementById("paperMapHideUnselected");
  if (filterToggle) {
    filterToggle.checked = paperMapHideUnselected;
    filterToggle.disabled = !selectedGroupId;
  }

  stage.querySelectorAll(".paper-map-paragraph").forEach(paragraph => {
    paragraph.hidden = active && paragraph.dataset.paperMapGroup !== selectedGroupId;
  });
  stage.querySelectorAll(".paper-map-section").forEach(section => {
    const hasMatch = [...section.querySelectorAll(".paper-map-paragraph")]
      .some(paragraph => paragraph.dataset.paperMapGroup === selectedGroupId);
    section.hidden = active && !hasMatch;
  });
  stage.querySelectorAll(".paper-map-column").forEach(column => {
    const hasMatch = [...column.querySelectorAll(".paper-map-paragraph")]
      .some(paragraph => paragraph.dataset.paperMapGroup === selectedGroupId);
    const emptyState = column.querySelector(".paper-map-filter-empty");
    if (emptyState) emptyState.hidden = !active || hasMatch;
  });
  stage.querySelectorAll(".paper-map-skeleton-block").forEach(block => {
    const hidden = active && block.dataset.paperMapGroup !== selectedGroupId;
    block.classList.toggle("filter-hidden", hidden);
    block.setAttribute("aria-hidden", String(hidden));
  });
}

function updatePaperMapSelectionDisplay() {
  setPaperMapGroupEmphasis();
  applyPaperMapSelectionFilter();
}

function scrollPaperMapToFirstOccurrence(groupId) {
  if (!groupId || paperMapMode !== "reading") return;
  const columns = [...stage.querySelectorAll(".paper-map-column")];
  if (!columns.length) return;
  if (paperMapScrollReleaseTimer) clearTimeout(paperMapScrollReleaseTimer);
  paperMapScrollSyncing = true;
  const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;

  columns.forEach(column => {
    const target = [...column.querySelectorAll(".paper-map-paragraph")]
      .find(paragraph => paragraph.dataset.paperMapGroup === groupId);
    const paperHead = column.querySelector(".paper-map-paper-head");
    const top = target
      ? column.scrollTop + target.getBoundingClientRect().top - column.getBoundingClientRect().top - (paperHead?.offsetHeight || 0) - 7
      : 0;
    const boundedTop = Math.max(0, Math.min(top, column.scrollHeight - column.clientHeight));
    column.scrollTo({ top: boundedTop, behavior: reduceMotion ? "auto" : "smooth" });
    paperMapScrollByPaper[column.dataset.paper] = boundedTop;
  });

  paperMapScrollReleaseTimer = setTimeout(() => {
    paperMapScrollSyncing = false;
    paperMapScrollReleaseTimer = null;
  }, reduceMotion ? 0 : 500);
}

function selectPaperMapGroup(groupId, { scroll = true } = {}) {
  const nextGroupId = groupId && paperMapSelectedGroupId !== groupId ? groupId : null;
  paperMapSelectedGroupId = nextGroupId;
  if (!nextGroupId) paperMapHideUnselected = false;
  updatePaperMapSelectionDisplay();
  if (nextGroupId && scroll) scrollPaperMapToFirstOccurrence(nextGroupId);
}

function syncPaperMapColumns(source, columns) {
  if (!paperMapSyncScroll || paperMapScrollSyncing) return;
  const maximum = Math.max(0, source.scrollHeight - source.clientHeight);
  const ratio = maximum ? source.scrollTop / maximum : 0;
  paperMapScrollSyncing = true;
  columns.forEach(target => {
    if (target === source) return;
    const top = ratio * Math.max(0, target.scrollHeight - target.clientHeight);
    target.scrollTop = top;
    paperMapScrollByPaper[target.dataset.paper] = top;
  });
  requestAnimationFrame(() => { paperMapScrollSyncing = false; });
}

function attachPaperMapInteractions(model) {
  const shell = stage.querySelector(".paper-map-shell");
  if (shell) shell.addEventListener("click", event => event.stopPropagation());
  document.getElementById("paperMapHistorySource")?.addEventListener("change", event => {
    paperMapHistorySource = event.target.value;
    paperMapSelectedGroupId = null;
    paperMapHideUnselected = false;
    if (paperMapHistorySource !== "iterations") {
      paperMapEpochStageIndex = Math.max(0, Math.min(paperMapEpochStageIndex, paperMapHistory().stages.length - 1));
    }
    refreshParagraphInspector();
    renderPaperMap();
  });
  stage.querySelectorAll("[data-paper-map-stage-index]").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      const stageIndex = Number(button.dataset.paperMapStageIndex);
      if (paperMapHistorySource === "iterations") currentIteration = stageIndex;
      else paperMapEpochStageIndex = stageIndex;
      paperMapSelectedGroupId = null;
      paperMapHideUnselected = false;
      renderPaperMap();
    });
  });
  stage.querySelectorAll("[data-paper-map-mode]").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      if (paperMapMode === button.dataset.paperMapMode) return;
      paperMapMode = button.dataset.paperMapMode;
      renderPaperMap();
      if (paperMapSelectedGroupId && paperMapMode === "reading") {
        requestAnimationFrame(() => scrollPaperMapToFirstOccurrence(paperMapSelectedGroupId));
      }
    });
  });

  const columns = [...stage.querySelectorAll(".paper-map-column")];
  columns.forEach(column => {
    column.addEventListener("scroll", () => {
      if (paperMapScrollSyncing) return;
      paperMapLastScrolledPaper = column.dataset.paper;
      paperMapScrollByPaper[column.dataset.paper] = column.scrollTop;
      syncPaperMapColumns(column, columns);
    }, { passive: true });
  });
  const syncToggle = document.getElementById("paperMapSyncScroll");
  if (syncToggle) {
    syncToggle.addEventListener("change", event => {
      event.stopPropagation();
      paperMapSyncScroll = syncToggle.checked;
      if (!paperMapSyncScroll || !columns.length) return;
      const source = columns.find(column => column.dataset.paper === paperMapLastScrolledPaper) || columns[0];
      syncPaperMapColumns(source, columns);
    });
  }
  const filterToggle = document.getElementById("paperMapHideUnselected");
  if (filterToggle) {
    filterToggle.addEventListener("change", event => {
      event.stopPropagation();
      paperMapHideUnselected = filterToggle.checked;
      applyPaperMapSelectionFilter();
      if (paperMapHideUnselected && paperMapSelectedGroupId) {
        scrollPaperMapToFirstOccurrence(paperMapSelectedGroupId);
      }
    });
  }

  stage.querySelectorAll(".paper-map-paragraph, .paper-map-skeleton-block").forEach(card => {
    const groupId = card.dataset.paperMapGroup;
    card.addEventListener("mouseenter", () => setPaperMapGroupEmphasis(groupId));
    card.addEventListener("mouseleave", () => setPaperMapGroupEmphasis());
    card.addEventListener("click", event => {
      if (event.target.closest("[data-paragraph-inspect]")) return;
      event.stopPropagation();
      selectPaperMapGroup(groupId);
    });
  });
  stage.querySelectorAll(".paper-map-legend-item").forEach(button => {
    const groupId = button.dataset.paperMapGroup;
    button.addEventListener("mouseenter", () => setPaperMapGroupEmphasis(groupId));
    button.addEventListener("mouseleave", () => setPaperMapGroupEmphasis());
    button.addEventListener("click", event => {
      event.stopPropagation();
      selectPaperMapGroup(groupId);
    });
  });
  const content = stage.querySelector(".paper-map-columns, .paper-map-skeleton-columns");
  if (content) {
    content.addEventListener("click", event => {
      event.stopPropagation();
      selectPaperMapGroup(null, { scroll: false });
    });
  }
  updatePaperMapSelectionDisplay();
}

function traceIterationNumbers() {
  return currentQiHistory().stages.map((_, stageIndex) => stageIndex);
}

function traceStageDescriptor(stageIndex) {
  return currentQiHistory().stages[stageIndex] || null;
}

function traceGroupForIteration(stageIndex, groupId) {
  return (traceStageDescriptor(stageIndex)?.groups || []).find(group => group.group_id === groupId) || null;
}

function traceQiPrimeLabel(groupId) {
  const index = (traceStageDescriptor(0)?.groups || []).findIndex(group => group.group_id === groupId);
  return index >= 0 ? `QI-${index + 1}` : groupId;
}

function traceIterationGroupLabel(stageIndex, groupId) {
  if (!groupId) return "Unassigned";
  const descriptor = traceStageDescriptor(stageIndex);
  const index = (descriptor?.groups || []).findIndex(group => group.group_id === groupId);
  return index >= 0 ? `${descriptor.groupPrefix}-${index + 1}` : descriptor?.groupPrefix || `Step ${stageIndex}`;
}

function traceGroupLabel(stageIndex, groupId) {
  if (!groupId) return "Unassigned";
  return `${traceIterationGroupLabel(stageIndex, groupId)} · ${traceQiPrimeLabel(groupId)}`;
}

function traceAssignmentMap(stageIndex) {
  const assignments = new Map();
  (traceStageDescriptor(stageIndex)?.groups || []).forEach(group => {
    (group.members || []).forEach(member => {
      const key = `${member.paper}:${member.unit_id}`;
      if (paragraphUnitLookup[key] && !assignments.has(key)) assignments.set(key, group.group_id);
    });
  });
  return assignments;
}

function traceMemberSet(group) {
  return new Set((group?.members || [])
    .map(member => `${member.paper}:${member.unit_id}`)
    .filter(key => paragraphUnitLookup[key]));
}

function traceFlowItems(keys, assignments, stageIndex) {
  const keysByGroup = new Map();
  keys.forEach(key => {
    const groupId = assignments.get(key) || null;
    if (!keysByGroup.has(groupId)) keysByGroup.set(groupId, []);
    keysByGroup.get(groupId).push(key);
  });
  return [...keysByGroup.entries()]
    .map(([groupId, paragraphKeys]) => ({
      groupId,
      count: paragraphKeys.length,
      paragraphKeys,
      iteration: stageIndex,
      label: traceGroupLabel(stageIndex, groupId),
      question: groupId ? (traceGroupForIteration(stageIndex, groupId)?.overarching_question || "Group not present in this snapshot") : "No group assignment",
    }))
    .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label, undefined, { numeric: true }));
}

function buildQiPrimeTraceModel(groupId) {
  const iterations = traceIterationNumbers();
  const history = currentQiHistory();
  const assignmentsByIteration = {};
  iterations.forEach(iteration => { assignmentsByIteration[iteration] = traceAssignmentMap(iteration); });

  const stages = iterations.map((iteration, index) => {
    const descriptor = history.stages[iteration];
    const group = traceGroupForIteration(iteration, groupId);
    const memberKeys = traceMemberSet(group);
    const previousMemberKeys = index ? traceMemberSet(traceGroupForIteration(iterations[index - 1], groupId)) : new Set();
    const entered = index ? [...memberKeys].filter(key => !previousMemberKeys.has(key)) : [];
    const left = index ? [...previousMemberKeys].filter(key => !memberKeys.has(key)) : [];
    const retained = index ? [...memberKeys].filter(key => previousMemberKeys.has(key)) : [];
    const paperCounts = Object.fromEntries(allPapers.map(paper => [paper.paper_id, 0]));
    memberKeys.forEach(key => {
      const paperId = key.slice(0, key.indexOf(":"));
      paperCounts[paperId] = (paperCounts[paperId] || 0) + 1;
    });
    const representedPaperCount = Object.values(paperCounts).filter(Boolean).length;
    const storedBalance = descriptor?.balanceByGroupId?.[groupId];
    const computedBalance = allPapers.length ? (representedPaperCount / allPapers.length) * 100 : 0;
    const previousIteration = index ? iterations[index - 1] : null;
    const previousGroup = index ? traceGroupForIteration(previousIteration, groupId) : null;
    const question = compactText(group?.overarching_question);
    const previousQuestion = compactText(previousGroup?.overarching_question);
    return {
      iteration,
      descriptor,
      group,
      question,
      previousQuestion,
      questionChanged: Boolean(group && previousGroup && question !== previousQuestion),
      memberKeys,
      entered,
      left,
      retained,
      paperCounts,
      representedPaperCount,
      balance: descriptor?.kind === "baseline" || !group ? null : (storedBalance ?? computedBalance),
      sources: index ? traceFlowItems(entered, assignmentsByIteration[previousIteration], previousIteration) : [],
      destinations: index ? traceFlowItems(left, assignmentsByIteration[iteration], iteration) : [],
    };
  });

  const paragraphKeys = [...new Set(stages.flatMap(stageState => [...stageState.memberKeys]))];
  return { history, groupId, iterations, assignmentsByIteration, stages, paragraphKeys, colorByGroupId: paperMapColorCatalog() };
}

function questionDiffTokens(value) {
  return compactText(value).match(/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)?|[^\sA-Za-z0-9]/g) || [];
}

// Word-level LCS gives a deterministic revision diff. It is only a display
// operation; it does not infer whether two questions are conceptually equal.
function renderQuestionDiff(previousQuestion, question) {
  const before = questionDiffTokens(previousQuestion);
  const after = questionDiffTokens(question);
  const table = Array.from({ length: before.length + 1 }, () => Array(after.length + 1).fill(0));
  for (let i = before.length - 1; i >= 0; i -= 1) {
    for (let j = after.length - 1; j >= 0; j -= 1) {
      table[i][j] = before[i] === after[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
    }
  }

  const operations = [];
  let i = 0;
  let j = 0;
  while (i < before.length || j < after.length) {
    if (i < before.length && j < after.length && before[i] === after[j]) {
      operations.push({ type: "same", token: before[i] }); i += 1; j += 1;
    } else if (j < after.length && (i === before.length || table[i][j + 1] > table[i + 1][j])) {
      operations.push({ type: "added", token: after[j] }); j += 1;
    } else {
      operations.push({ type: "removed", token: before[i] }); i += 1;
    }
  }

  const noSpaceBefore = /^[,.;:!?%\)\]\}]$/;
  const noSpaceAfter = /^[\(\[\{]$/;
  return operations.map((operation, index) => {
    const priorToken = index ? operations[index - 1].token : "";
    const spacing = index && !noSpaceBefore.test(operation.token) && !noSpaceAfter.test(priorToken) ? " " : "";
    const token = escapeHtml(operation.token);
    if (operation.type === "removed") return `${spacing}<del>${token}</del>`;
    if (operation.type === "added") return `${spacing}<ins>${token}</ins>`;
    return `${spacing}${token}`;
  }).join("");
}

function formatTraceBalance(balance) {
  if (balance === null || balance === undefined) return "—";
  const numeric = Number(balance);
  return `${numeric.toFixed(Number.isInteger(numeric) ? 0 : 1)}%`;
}

function renderTracePaperCounts(stageState) {
  return `<div class="qi-trace-paper-counts">${allPapers.map(paper => {
    const count = stageState.paperCounts[paper.paper_id] || 0;
    const state = count ? "represented" : "missing";
    const description = count ? `${count} assigned paragraph${count === 1 ? "" : "s"}` : "not represented";
    return `<div class="qi-trace-paper-count" title="${escapeHtml(`${paper.title}: ${description}`)}">
      <span class="unit-square ${state}" style="--paper-color:${paperColorById[paper.paper_id] || "#ced4da"}"></span>
      <span>${escapeHtml(shortPaperLabel(paper))}</span><strong>${count}</strong>
    </div>`;
  }).join("")}</div>`;
}

function renderTraceFlow(items, title) {
  const body = items.length ? items.map(item => {
    const text = `${item.label} · ${item.count}`;
    const tooltip = `${text} paragraph${item.count === 1 ? "" : "s"} · ${item.question}`;
    const canTrace = item.groupId && Boolean(traceGroupForIteration(0, item.groupId));
    return canTrace
      ? `<button type="button" class="qi-trace-flow-chip" data-trace-target-group="${escapeHtml(item.groupId)}" title="${escapeHtml(tooltip)}">${escapeHtml(text)}</button>`
      : `<span class="qi-trace-flow-chip" title="${escapeHtml(tooltip)}">${escapeHtml(text)}</span>`;
  }).join("") : `<span class="qi-trace-flow-empty">none</span>`;
  return `<div class="qi-trace-flow"><span class="qi-trace-flow-title">${escapeHtml(title)}</span>${body}</div>`;
}

function renderTraceStage(stageState, traceColor) {
  const descriptor = stageState.descriptor;
  const isBaseline = descriptor.kind === "baseline";
  const isRevision = descriptor.kind === "revision";
  const membershipChanged = stageState.entered.length > 0 || stageState.left.length > 0;
  const groupLabel = stageState.group ? traceGroupLabel(stageState.iteration, stageState.group.group_id) : descriptor.label;
  const stateLabel = isBaseline
    ? "QI-Prime"
    : !stageState.group
      ? "dropped"
      : isRevision
        ? (stageState.questionChanged ? "question revised" : "question unchanged")
        : (membershipChanged ? "assignment updated" : "assignment unchanged");
  const stateClass = !stageState.group ? " dropped" : isRevision && stageState.questionChanged ? " revised" : !isRevision && membershipChanged ? " assignment" : "";
  const questionHtml = stageState.group
    ? `<div class="qi-trace-question">${escapeHtml(stageState.question || "(no question)")}</div>`
    : `<div class="qi-trace-question qi-trace-dropped-note">This group ID is no longer present in the saved candidate set. Its departing paragraphs remain traced below.</div>`;
  let diffHtml = `<div class="qi-trace-question-diff"><span class="qi-trace-question-diff-label">Question history</span>Initial QI-Prime wording</div>`;
  if (!isBaseline && stageState.group && stageState.previousQuestion) {
    const label = stageState.questionChanged ? "Changes from previous step" : isRevision ? "M-step question history" : "Question used for assignment";
    const value = stageState.questionChanged ? renderQuestionDiff(stageState.previousQuestion, stageState.question) : "No wording change";
    diffHtml = `<div class="qi-trace-question-diff"><span class="qi-trace-question-diff-label">${label}</span>${value}</div>`;
  } else if (!isBaseline && !stageState.group) {
    diffHtml = `<div class="qi-trace-question-diff"><span class="qi-trace-question-diff-label">Question history</span>No revised question for this group ID</div>`;
  }

  const balanceValue = isBaseline ? "pre" : formatTraceBalance(stageState.balance);
  const balanceLabel = isBaseline ? "assignment" : "balance";
  const flowHtml = isBaseline
    ? `<div class="qi-trace-flows"><div class="qi-trace-flow"><span class="qi-trace-flow-title">Baseline</span><span class="qi-trace-flow-empty">bidirectional matches</span></div></div>`
    : isRevision
      ? `<div class="qi-trace-flows"><div class="qi-trace-flow"><span class="qi-trace-flow-title">M-step</span><span class="qi-trace-flow-empty">membership held constant while the question is revised</span></div></div>`
      : `<div class="qi-trace-flows">${renderTraceFlow(stageState.sources, "Arrived from")}${renderTraceFlow(stageState.destinations, "Departed to")}</div>`;
  const membershipChangeHtml = isBaseline ? "" : isRevision
    ? `<div class="qi-trace-membership-change"><strong>${stageState.memberKeys.size}</strong> paragraphs remain fixed during this question revision</div>`
    : `<div class="qi-trace-membership-change"><strong>${stageState.retained.length}</strong> retained · <strong>${stageState.entered.length}</strong> arrived · <strong>${stageState.left.length}</strong> departed</div>`;
  return `<article class="qi-trace-stage${stageState.group ? "" : " dropped"}" style="--trace-color:${traceColor.border}">
    <div class="qi-trace-stage-head"><span class="qi-trace-stage-label">${escapeHtml(groupLabel)}</span><span class="qi-trace-stage-state${stateClass}">${escapeHtml(stateLabel)}</span></div>
    ${questionHtml}${diffHtml}
    <div class="qi-trace-stats">
      <div class="qi-trace-stat"><strong>${stageState.memberKeys.size}</strong><span>paragraphs</span></div>
      <div class="qi-trace-stat"><strong>${stageState.representedPaperCount}/${allPapers.length}</strong><span>papers</span></div>
      <div class="qi-trace-stat"><strong>${balanceValue}</strong><span>${balanceLabel}</span></div>
    </div>
    ${renderTracePaperCounts(stageState)}${membershipChangeHtml}${flowHtml}
  </article>`;
}

function traceParagraphSort(a, b) {
  const paperOrder = new Map(allPapers.map((paper, index) => [paper.paper_id, index]));
  const splitKey = key => {
    const delimiter = key.indexOf(":");
    return [key.slice(0, delimiter), key.slice(delimiter + 1)];
  };
  const [paperA, unitA] = splitKey(a);
  const [paperB, unitB] = splitKey(b);
  const paperDifference = (paperOrder.get(paperA) ?? 999) - (paperOrder.get(paperB) ?? 999);
  return paperDifference || unitA.localeCompare(unitB, undefined, { numeric: true });
}

function tracePathState(model, key, iteration) {
  const descriptor = model.history.stages[iteration];
  if (descriptor.kind === "baseline") return model.assignmentsByIteration[iteration].get(key) === model.groupId ? "baseline" : "initial";
  const previousGroupId = model.assignmentsByIteration[iteration - 1].get(key) || null;
  const groupId = model.assignmentsByIteration[iteration].get(key) || null;
  if (previousGroupId === groupId) {
    const stageState = model.stages[iteration];
    if (descriptor.kind === "revision") return stageState.questionChanged && groupId === model.groupId ? "question revised; assignment unchanged" : "assignment unchanged";
    return groupId === model.groupId ? "retained" : "unchanged";
  }
  if (groupId === model.groupId) return `entered from ${traceIterationGroupLabel(iteration - 1, previousGroupId)}`;
  if (previousGroupId === model.groupId) return `left to ${traceIterationGroupLabel(iteration, groupId)}`;
  return `from ${traceIterationGroupLabel(iteration - 1, previousGroupId)}`;
}

function renderTracePathCell(model, key, iteration) {
  const groupId = model.assignmentsByIteration[iteration].get(key) || null;
  const previousGroupId = iteration ? (model.assignmentsByIteration[iteration - 1].get(key) || null) : groupId;
  const changed = iteration > 0 && groupId !== previousGroupId;
  const color = groupId ? (model.colorByGroupId.get(groupId) || paperMapColor(0)) : { border: "#adb5bd", fill: "#f8f9fa" };
  const label = traceIterationGroupLabel(iteration, groupId);
  const question = groupId ? (traceGroupForIteration(iteration, groupId)?.overarching_question || "Group not present") : "No group assignment";
  const state = tracePathState(model, key, iteration);
  const classes = ["qi-trace-path-cell", groupId === model.groupId ? "selected-lineage" : "", groupId ? "" : "unassigned", changed ? "changed" : ""].filter(Boolean).join(" ");
  return `<div class="${classes}" style="--path-color:${color.border};--path-fill:${color.fill}" title="${escapeHtml(`${label} · ${question}`)}">
    <strong>${escapeHtml(label)}</strong><span class="qi-trace-path-question">${escapeHtml(question)}</span><span class="qi-trace-path-state">${escapeHtml(state)}</span>
  </div>`;
}

function traceParagraphChanged(model, key) {
  const path = model.iterations.map(iteration => model.assignmentsByIteration[iteration].get(key) || null);
  return path.some((groupId, index) => index > 0 && groupId !== path[index - 1]);
}

function renderTraceParagraphDetail(model) {
  const slot = document.getElementById("qiTraceParagraphDetail");
  if (!slot) return;
  stage.querySelectorAll(".qi-trace-matrix tbody tr").forEach(row => {
    row.classList.toggle("selected", row.dataset.traceParagraph === traceSelectedParagraphKey);
  });
  if (!traceSelectedParagraphKey || !paragraphUnitLookup[traceSelectedParagraphKey]) {
    slot.innerHTML = `<div class="qi-trace-paragraph-detail"><span class="qi-trace-flow-empty">Select a paragraph to inspect its text and complete assignment route.</span></div>`;
    return;
  }

  const delimiter = traceSelectedParagraphKey.indexOf(":");
  const paperId = traceSelectedParagraphKey.slice(0, delimiter);
  const unitId = traceSelectedParagraphKey.slice(delimiter + 1);
  const paper = allPapers.find(candidate => candidate.paper_id === paperId);
  const unit = paragraphUnitLookup[traceSelectedParagraphKey];
  const route = model.iterations.map(iteration => renderTracePathCell(model, traceSelectedParagraphKey, iteration)).join(`<span class="qi-trace-route-arrow">→</span>`);
  const movements = model.iterations.slice(1).flatMap(iteration => {
    const previousGroupId = model.assignmentsByIteration[iteration - 1].get(traceSelectedParagraphKey) || null;
    const groupId = model.assignmentsByIteration[iteration].get(traceSelectedParagraphKey) || null;
    return previousGroupId === groupId ? [] : [`${model.history.stages[iteration].shortLabel}: ${traceIterationGroupLabel(iteration - 1, previousGroupId)} → ${traceIterationGroupLabel(iteration, groupId)}`];
  });
  slot.innerHTML = `<div class="qi-trace-paragraph-detail">
    <h3>${escapeHtml(shortPaperLabel(paper || { paper_id: paperId }))} · ${escapeHtml(unitId)}</h3>
    <div class="qi-trace-detail-question">${escapeHtml(unit.tag || "(no paragraph question)")}</div>
    <div class="qi-trace-detail-text">${escapeHtml(compactText(unit.text))}</div>
    <div class="qi-trace-detail-route">${route}</div>
    <div class="qi-trace-summary" style="margin-top:6px"><strong>Reassignments:</strong> ${movements.length ? escapeHtml(movements.join(" · ")) : "none"}</div>
  </div>`;
}

function renderQiPrimeTraceMatrix(model) {
  let paragraphKeys = [...model.paragraphKeys].sort(traceParagraphSort);
  if (tracePaperFilter !== "all") paragraphKeys = paragraphKeys.filter(key => key.startsWith(`${tracePaperFilter}:`));
  if (traceChangedOnly) paragraphKeys = paragraphKeys.filter(key => traceParagraphChanged(model, key));
  const paperOptions = [`<option value="all"${tracePaperFilter === "all" ? " selected" : ""}>All papers</option>`]
    .concat(allPapers.map(paper => `<option value="${escapeHtml(paper.paper_id)}"${tracePaperFilter === paper.paper_id ? " selected" : ""}>${escapeHtml(shortPaperLabel(paper))}</option>`))
    .join("");
  const headers = model.iterations.map(iteration => `<th scope="col">${escapeHtml(model.history.stages[iteration].shortLabel)}</th>`).join("");
  const rows = paragraphKeys.map(key => {
    const delimiter = key.indexOf(":");
    const paperId = key.slice(0, delimiter);
    const unitId = key.slice(delimiter + 1);
    const paper = allPapers.find(candidate => candidate.paper_id === paperId);
    const unit = paragraphUnitLookup[key];
    const cells = model.iterations.map(iteration => `<td>${renderTracePathCell(model, key, iteration)}</td>`).join("");
    return `<tr data-trace-paragraph="${escapeHtml(key)}"${traceSelectedParagraphKey === key ? " class=\"selected\"" : ""}>
      <td><button type="button" class="qi-trace-paragraph-button" data-trace-paragraph-button="${escapeHtml(key)}"><strong>${escapeHtml(shortPaperLabel(paper || { paper_id: paperId }))} · ${escapeHtml(unitId)}</strong><span title="${escapeHtml(unit.tag || "")}">${escapeHtml(unit.tag || "(no paragraph question)")}</span></button></td>${cells}
    </tr>`;
  }).join("");
  const body = rows || `<tr><td colspan="${model.iterations.length + 1}"><div class="qi-trace-empty-rows">No paragraphs match these filters.</div></td></tr>`;
  return `<section class="qi-trace-matrix-wrap">
    <div class="qi-trace-matrix-toolbar">
      <strong>Paragraph assignment paths</strong><span>${paragraphKeys.length} of ${model.paragraphKeys.length} paragraphs shown</span>
      <label>Paper <select id="qiTracePaperFilter">${paperOptions}</select></label>
      <label><input type="checkbox" id="qiTraceChangedOnly"${traceChangedOnly ? " checked" : ""}> changed only</label>
      <span>Outlined cells mark an assignment change; the heavier border marks this QI-Prime lineage.</span>
    </div>
    <div class="qi-trace-matrix-scroller"><table class="qi-trace-matrix"><thead><tr><th scope="col">Paragraph</th>${headers}</tr></thead><tbody>${body}</tbody></table></div>
    <div id="qiTraceParagraphDetail"></div>
  </section>`;
}

function renderQiPrimeTrace() {
  const history = currentQiHistory();
  const qiPrimes = history.stages[0]?.groups || [];
  if (!qiPrimes.length) {
    stage.innerHTML = `<div class="empty-state">No baseline QI-Primes are available to trace for this history source.</div>`;
    return;
  }
  if (!traceSelectedGroupId || !traceGroupForIteration(0, traceSelectedGroupId)) traceSelectedGroupId = qiPrimes[0].group_id;
  const model = buildQiPrimeTraceModel(traceSelectedGroupId);
  const traceColor = model.colorByGroupId.get(traceSelectedGroupId) || paperMapColor(0);
  const selectedIndex = qiPrimes.findIndex(group => group.group_id === traceSelectedGroupId);
  const options = qiPrimes.map((group, index) => {
    const selected = group.group_id === traceSelectedGroupId ? " selected" : "";
    return `<option value="${escapeHtml(group.group_id)}"${selected}>QI-${index + 1} · ${escapeHtml(compactText(group.overarching_question))}</option>`;
  }).join("");
  const stages = model.stages.map(stageState => renderTraceStage(stageState, traceColor)).join("");
  const provenance = history.key === "epochs"
    ? "E-steps change membership; M-steps reuse that exact membership and only revise wording."
    : "Each iteration is a saved combined reassignment and question-revision snapshot.";
  stage.innerHTML = `<div class="qi-trace-shell">
    <div class="qi-trace-toolbar">
      <label class="qi-history-source-control"><span class="qi-trace-control-label">History source</span><select id="qiTraceHistorySource" class="qi-trace-select">${qiHistorySourceOptions(qiHistorySource)}</select></label>
      <label class="qi-trace-control"><span class="qi-trace-control-label">${escapeHtml(history.baselineLabel)}</span><select id="qiTraceGroupSelect" class="qi-trace-select">${options}</select></label>
      <div class="qi-trace-summary"><strong>QI-${selectedIndex + 1} · ${escapeHtml(traceSelectedGroupId)}</strong><br>Exact lineage follows the saved group ID. ${escapeHtml(provenance)} Arrivals and departures are deterministic set differences, and dropped IDs are never assigned inferred successors.</div>
    </div>
    <div class="qi-trace-timeline" style="--trace-stage-count:${model.stages.length}" aria-label="Question and membership history across ${model.stages.length} saved stages">${stages}</div>
    ${renderQiPrimeTraceMatrix(model)}
  </div>`;
  attachQiPrimeTraceInteractions(model);
  renderTraceParagraphDetail(model);
}

function attachQiPrimeTraceInteractions(model) {
  const shell = stage.querySelector(".qi-trace-shell");
  if (shell) shell.addEventListener("click", event => event.stopPropagation());
  document.getElementById("qiTraceHistorySource")?.addEventListener("change", event => {
    qiHistorySource = event.target.value;
    traceSelectedGroupId = currentQiHistory().stages[0]?.groups?.[0]?.group_id || null;
    traceSelectedParagraphKey = null;
    refreshParagraphInspector();
    renderQiPrimeTrace();
  });
  const groupSelect = document.getElementById("qiTraceGroupSelect");
  if (groupSelect) groupSelect.addEventListener("change", () => {
    traceSelectedGroupId = groupSelect.value;
    traceSelectedParagraphKey = null;
    renderQiPrimeTrace();
  });
  const paperFilter = document.getElementById("qiTracePaperFilter");
  if (paperFilter) paperFilter.addEventListener("change", () => {
    tracePaperFilter = paperFilter.value;
    renderQiPrimeTrace();
  });
  const changedOnly = document.getElementById("qiTraceChangedOnly");
  if (changedOnly) changedOnly.addEventListener("change", () => {
    traceChangedOnly = changedOnly.checked;
    renderQiPrimeTrace();
  });
  stage.querySelectorAll("[data-trace-paragraph-button]").forEach(button => {
    button.addEventListener("click", () => {
      traceSelectedParagraphKey = traceSelectedParagraphKey === button.dataset.traceParagraphButton ? null : button.dataset.traceParagraphButton;
      renderTraceParagraphDetail(model);
    });
  });
  stage.querySelectorAll("[data-trace-target-group]").forEach(button => {
    button.addEventListener("click", () => {
      traceSelectedGroupId = button.dataset.traceTargetGroup;
      traceSelectedParagraphKey = null;
      renderQiPrimeTrace();
    });
  });
}

function qiFlowPaperCounts(paragraphKeys) {
  const counts = Object.fromEntries(allPapers.map(paper => [paper.paper_id, 0]));
  paragraphKeys.forEach(key => {
    const paperId = key.slice(0, key.indexOf(":"));
    counts[paperId] = (counts[paperId] || 0) + 1;
  });
  return counts;
}

function renderQiFlowPaperMarkers(paragraphKeys) {
  const counts = qiFlowPaperCounts(paragraphKeys);
  return `<span class="qi-flow-node-papers">${allPapers.map(paper => {
    const count = counts[paper.paper_id] || 0;
    const state = count ? "represented" : "missing";
    const title = `${paper.title}: ${count} paragraph${count === 1 ? "" : "s"}`;
    return `<span class="unit-square ${state}" style="--paper-color:${paperColorById[paper.paper_id] || "#ced4da"}" title="${escapeHtml(title)}"></span>`;
  }).join("")}</span>`;
}

function qiFlowBalance(iteration, groupId, memberKeys) {
  const descriptor = traceStageDescriptor(iteration);
  if (descriptor?.kind === "baseline" || !groupId) return null;
  const stored = descriptor?.balanceByGroupId?.[groupId];
  if (stored !== undefined) return stored;
  const represented = Object.values(qiFlowPaperCounts(memberKeys)).filter(Boolean).length;
  return allPapers.length ? (represented / allPapers.length) * 100 : 0;
}

function buildQiFlowNode(traceModel, { key, iteration, groupId, role, flowKeys = [], focal = false }) {
  const group = groupId ? traceGroupForIteration(iteration, groupId) : null;
  const memberKeys = [...traceMemberSet(group)];
  const dropped = focal && !group;
  const unassigned = !focal && !groupId;
  const color = groupId ? (traceModel.colorByGroupId.get(groupId) || paperMapColor(0)) : { border: "#adb5bd", fill: "#fff" };
  const roleLabels = { previous: "selected before", current: "selected after", source: "source question", destination: "destination question" };
  return {
    key,
    iteration,
    descriptor: traceStageDescriptor(iteration),
    groupId,
    group,
    role,
    focal,
    dropped,
    unassigned,
    color,
    flowKeys,
    memberKeys,
    balance: qiFlowBalance(iteration, groupId, memberKeys),
    label: group ? traceGroupLabel(iteration, groupId) : focal ? (traceStageDescriptor(iteration)?.label || `Step ${iteration}`) : "Unassigned",
    question: group ? compactText(group.overarching_question) : dropped ? "This QI-Prime is not present in this saved snapshot." : "No question group assignment",
    kind: dropped ? "dropped" : unassigned ? "unassigned" : roleLabels[role] || role,
    targetGroupId: groupId && traceGroupForIteration(0, groupId) ? groupId : null,
  };
}

function buildQiPrimeFlowModel(groupId, transition) {
  const traceModel = buildQiPrimeTraceModel(groupId);
  const previousIteration = transition - 1;
  const currentIteration = transition;
  const previousStage = traceModel.stages[previousIteration];
  const currentStage = traceModel.stages[currentIteration];
  const previousSelected = buildQiFlowNode(traceModel, {
    key: "selected:previous", iteration: previousIteration, groupId, role: "previous", focal: true,
  });
  const currentSelected = buildQiFlowNode(traceModel, {
    key: "selected:current", iteration: currentIteration, groupId, role: "current", focal: true,
  });
  const sourceNodes = currentStage.sources.map(item => buildQiFlowNode(traceModel, {
    key: `source:${item.groupId || "unassigned"}`,
    iteration: previousIteration,
    groupId: item.groupId,
    role: "source",
    flowKeys: item.paragraphKeys,
  }));
  const destinationNodes = currentStage.destinations.map(item => buildQiFlowNode(traceModel, {
    key: `destination:${item.groupId || "unassigned"}`,
    iteration: currentIteration,
    groupId: item.groupId,
    role: "destination",
    flowKeys: item.paragraphKeys,
  }));

  const nodes = [previousSelected, currentSelected, ...sourceNodes, ...destinationNodes];
  const nodesByKey = new Map(nodes.map(node => [node.key, node]));
  const selectedColor = traceModel.colorByGroupId.get(groupId) || paperMapColor(0);
  const edges = [];
  if (currentStage.retained.length) {
    edges.push({
      id: "retained",
      kind: "retained",
      from: previousSelected.key,
      to: currentSelected.key,
      paragraphKeys: currentStage.retained,
      color: selectedColor.border,
      label: `${currentStage.retained.length} retained`,
    });
  }
  currentStage.sources.forEach(item => {
    const sourceKey = `source:${item.groupId || "unassigned"}`;
    const sourceNode = nodesByKey.get(sourceKey);
    edges.push({
      id: `arrived:${item.groupId || "unassigned"}`,
      kind: "arrived",
      from: sourceKey,
      to: currentSelected.key,
      paragraphKeys: item.paragraphKeys,
      color: sourceNode?.color.border || "#868e96",
      label: `${item.count} arrived`,
    });
  });
  currentStage.destinations.forEach(item => {
    const destinationKey = `destination:${item.groupId || "unassigned"}`;
    const destinationNode = nodesByKey.get(destinationKey);
    edges.push({
      id: `departed:${item.groupId || "unassigned"}`,
      kind: "departed",
      from: previousSelected.key,
      to: destinationKey,
      paragraphKeys: item.paragraphKeys,
      color: destinationNode?.color.border || "#868e96",
      label: `${item.count} departed`,
    });
  });
  edges.forEach(edge => {
    edge.fromNode = nodesByKey.get(edge.from);
    edge.toNode = nodesByKey.get(edge.to);
  });

  return {
    traceModel,
    groupId,
    transition,
    previousIteration,
    currentIteration,
    previousStage,
    currentStage,
    previousSelected,
    currentSelected,
    sourceNodes,
    destinationNodes,
    nodes,
    nodesByKey,
    edges,
  };
}

function splitQiFlowNodes(nodes) {
  const top = [];
  const bottom = [];
  nodes.forEach((node, index) => (index % 2 ? bottom : top).push(node));
  return { top, bottom };
}

function renderQiFlowNode(node) {
  const classes = ["qi-flow-node", node.focal ? "focal" : "", node.dropped ? "dropped" : "", node.unassigned ? "unassigned" : ""].filter(Boolean).join(" ");
  const balance = node.dropped || node.unassigned ? "—" : node.descriptor?.kind === "baseline" ? "pre-assignment" : formatTraceBalance(node.balance);
  const paragraphSummary = node.focal
    ? `<strong>${node.memberKeys.length}</strong> total paragraphs`
    : `<strong>${node.flowKeys.length}</strong> moving · ${node.memberKeys.length} total`;
  const representedKeys = node.focal ? node.memberKeys : node.flowKeys;
  const targetAttribute = node.targetGroupId && node.targetGroupId !== traceSelectedGroupId
    ? ` data-qi-flow-target-group="${escapeHtml(node.targetGroupId)}" title="Trace this QI-Prime lineage"`
    : "";
  const tagName = targetAttribute ? "button" : "article";
  const typeAttribute = targetAttribute ? ` type="button"` : "";
  return `<${tagName}${typeAttribute} class="${classes}" data-qi-flow-node-key="${escapeHtml(node.key)}"${targetAttribute} style="--node-color:${node.color.border};--node-fill:${node.color.fill}">
    <div class="qi-flow-node-head"><span class="qi-flow-node-label">${escapeHtml(node.label)}</span><span class="qi-flow-node-kind">${escapeHtml(node.kind)}</span></div>
    <div class="qi-flow-node-question">${escapeHtml(node.question)}</div>
    <div class="qi-flow-node-meta"><span>${paragraphSummary}</span><span>balance <strong>${balance}</strong></span>${renderQiFlowPaperMarkers(representedKeys)}</div>
  </${tagName}>`;
}

function renderQiFlowColumn(selectedNode, peripheralNodes) {
  const split = splitQiFlowNodes(peripheralNodes);
  const renderStack = nodes => nodes.map(renderQiFlowNode).join("");
  return `<div class="qi-flow-column"><div class="qi-flow-stack">${renderStack(split.top)}</div>${renderQiFlowNode(selectedNode)}<div class="qi-flow-stack">${renderStack(split.bottom)}</div></div>`;
}

function qiFlowStageBalanceLabel(stageState) {
  if (stageState.descriptor?.kind === "baseline") return "pre";
  return stageState.group ? formatTraceBalance(stageState.balance) : "—";
}

function renderQiFlowRevision(model, animate) {
  const before = model.previousStage;
  const after = model.currentStage;
  const membershipChanged = after.entered.length > 0 || after.left.length > 0;
  const isRevision = after.descriptor?.kind === "revision";
  let state = isRevision ? "Question unchanged" : membershipChanged ? "Paragraph assignments updated" : "Assignments unchanged";
  let description = `${before.descriptor.label} to ${after.descriptor.label}`;
  let diff = isRevision ? "No wording change" : "Question held fixed while paragraph assignments were recomputed";
  if (before.group && after.group && after.questionChanged) {
    state = "Question revised";
    diff = renderQuestionDiff(before.question, after.question);
  } else if (before.group && !after.group) {
    state = "QI-Prime dropped";
    description = `The stable group ID leaves the candidate set at ${after.descriptor.label}`;
    diff = `<del>${escapeHtml(before.question)}</del> <ins>No revised question</ins>`;
  } else if (!before.group && !after.group) {
    state = "Lineage already dropped";
    description = "No selected question exists in either saved snapshot";
    diff = "No question revision is available";
  } else if (!before.group && after.group) {
    state = "QI-Prime restored";
    diff = `<ins>${escapeHtml(after.question)}</ins>`;
  }
  const metric = (label, beforeValue, afterValue) => `<div class="qi-flow-metric">${escapeHtml(label)}<strong>${escapeHtml(beforeValue)} &rarr; ${escapeHtml(afterValue)}</strong></div>`;
  return `<section class="qi-flow-revision">
    <div class="qi-flow-revision-state"><strong>${escapeHtml(state)}</strong><span>${escapeHtml(description)}</span></div>
    <div class="qi-flow-revision-diff${animate ? " replay" : ""}"><span class="qi-trace-question-diff-label">Question wording</span>${diff}</div>
    <div class="qi-flow-revision-metrics">
      ${metric("paragraphs", String(before.memberKeys.size), String(after.memberKeys.size))}
      ${metric("paper coverage", `${before.representedPaperCount}/${allPapers.length}`, `${after.representedPaperCount}/${allPapers.length}`)}
      ${metric("balance", qiFlowStageBalanceLabel(before), qiFlowStageBalanceLabel(after))}
    </div>
  </section>`;
}

function renderQiFlowCanvas(model) {
  const largestHalfStack = Math.max(Math.ceil(model.sourceNodes.length / 2), Math.ceil(model.destinationNodes.length / 2));
  const canvasHeight = Math.max(560, 210 + largestHalfStack * 185);
  return `<div class="qi-flow-canvas-scroll"><div class="qi-flow-canvas" style="--qi-flow-canvas-height:${canvasHeight}px">
    <svg class="qi-flow-svg" aria-label="Paragraph flows from ${escapeHtml(model.previousStage.descriptor.label)} to ${escapeHtml(model.currentStage.descriptor.label)}"></svg>
    <span class="qi-flow-column-heading left">${escapeHtml(model.previousStage.descriptor.label)}</span>
    <span class="qi-flow-column-heading right">${escapeHtml(model.currentStage.descriptor.label)}</span>
    <div class="qi-flow-columns">${renderQiFlowColumn(model.previousSelected, model.sourceNodes)}${renderQiFlowColumn(model.currentSelected, model.destinationNodes)}</div>
  </div></div>`;
}

function qiFlowEdgeWidth(count) {
  return Math.min(18, 2.5 + Math.sqrt(Math.max(1, count)) * 2.7);
}

function qiFlowEdgePortY(edge, node, edgesForNode, nodeRects, canvasRect, endpoint) {
  const sorted = [...edgesForNode].sort((a, b) => {
    const otherA = nodeRects.get(endpoint === "from" ? a.to : a.from);
    const otherB = nodeRects.get(endpoint === "from" ? b.to : b.from);
    const centerA = otherA ? otherA.top + otherA.height / 2 : 0;
    const centerB = otherB ? otherB.top + otherB.height / 2 : 0;
    return centerA - centerB;
  });
  const index = Math.max(0, sorted.findIndex(candidate => candidate.id === edge.id));
  const rect = nodeRects.get(node.key);
  const padding = Math.min(18, rect.height * .22);
  const usable = Math.max(8, rect.height - padding * 2);
  return rect.top - canvasRect.top + padding + ((index + 1) * usable) / (sorted.length + 1);
}

function drawQiPrimeFlowLinks(model, animateDots = true) {
  const canvas = stage.querySelector(".qi-flow-canvas");
  const svg = stage.querySelector(".qi-flow-svg");
  if (!canvas || !svg) return;
  const canvasRect = canvas.getBoundingClientRect();
  const nodeRects = new Map();
  stage.querySelectorAll("[data-qi-flow-node-key]").forEach(node => nodeRects.set(node.dataset.qiFlowNodeKey, node.getBoundingClientRect()));
  const drawableEdges = model.edges.filter(edge => nodeRects.has(edge.from) && nodeRects.has(edge.to));
  const outgoing = new Map();
  const incoming = new Map();
  drawableEdges.forEach(edge => {
    if (!outgoing.has(edge.from)) outgoing.set(edge.from, []);
    if (!incoming.has(edge.to)) incoming.set(edge.to, []);
    outgoing.get(edge.from).push(edge);
    incoming.get(edge.to).push(edge);
  });
  const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const paths = [];
  const dots = [];
  const labels = [];
  const hits = [];
  drawableEdges.forEach(edge => {
    const fromRect = nodeRects.get(edge.from);
    const toRect = nodeRects.get(edge.to);
    const x1 = fromRect.right - canvasRect.left;
    const x2 = toRect.left - canvasRect.left;
    const y1 = qiFlowEdgePortY(edge, edge.fromNode, outgoing.get(edge.from), nodeRects, canvasRect, "from");
    const y2 = qiFlowEdgePortY(edge, edge.toNode, incoming.get(edge.to), nodeRects, canvasRect, "to");
    const controlOffset = Math.max(90, (x2 - x1) * .42);
    const path = `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 + controlOffset).toFixed(1)} ${y1.toFixed(1)}, ${(x2 - controlOffset).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    const width = qiFlowEdgeWidth(edge.paragraphKeys.length);
    const selected = edge.id === qiFlowSelectedEdgeId ? " selected" : "";
    const style = `--edge-color:${edge.color};--edge-width:${width.toFixed(1)}px;--edge-selected-width:${(width + 3).toFixed(1)}px;--edge-hit-width:${Math.max(18, width + 10).toFixed(1)}px`;
    paths.push(`<path class="qi-flow-edge-visible${selected}" data-qi-flow-edge="${escapeHtml(edge.id)}" d="${path}" style="${style}" marker-end="url(#qiFlowArrow)"></path>`);
    hits.push(`<path class="qi-flow-edge-hit" data-qi-flow-edge="${escapeHtml(edge.id)}" d="${path}" style="${style}"><title>${escapeHtml(edge.label)}</title></path>`);
    const labelT = edge.kind === "arrived" ? .62 : edge.kind === "departed" ? .38 : .5;
    const cubicPoint = (p0, p1, p2, p3, t) => ((1 - t) ** 3) * p0 + 3 * ((1 - t) ** 2) * t * p1 + 3 * (1 - t) * (t ** 2) * p2 + (t ** 3) * p3;
    const midX = cubicPoint(x1, x1 + controlOffset, x2 - controlOffset, x2, labelT);
    const midY = cubicPoint(y1, y1, y2, y2, labelT);
    labels.push(`<g class="qi-flow-edge-label" data-qi-flow-edge="${escapeHtml(edge.id)}" transform="translate(${midX.toFixed(1)} ${midY.toFixed(1)})" style="--edge-color:${edge.color}"><circle r="11"></circle><text y=".5">${edge.paragraphKeys.length}</text><title>${escapeHtml(edge.label)}</title></g>`);
    if (animateDots && !reduceMotion) {
      edge.paragraphKeys.forEach((key, index) => {
        const paperId = key.slice(0, key.indexOf(":"));
        const color = paperColorById[paperId] || "#495057";
        const emphasized = qiFlowPaperFilter === "all" || qiFlowPaperFilter === paperId;
        const peakOpacity = emphasized ? .92 : .12;
        const delay = (index % 14) * .035;
        dots.push(`<circle class="qi-flow-dot" data-qi-flow-edge="${escapeHtml(edge.id)}" r="3.2" fill="${color}" opacity="0">
          <animate attributeName="opacity" values="0;${peakOpacity};${peakOpacity};0" keyTimes="0;.08;.9;1" dur="1.25s" begin="${delay.toFixed(2)}s" fill="freeze"></animate>
          <animateMotion path="${path}" dur="1.25s" begin="${delay.toFixed(2)}s" fill="freeze"></animateMotion>
        </circle>`);
      });
    }
  });
  svg.setAttribute("viewBox", `0 0 ${canvas.clientWidth} ${canvas.clientHeight}`);
  svg.innerHTML = `<defs><marker id="qiFlowArrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#868e96"></path></marker></defs>${paths.join("")}${dots.join("")}${hits.join("")}${labels.join("")}`;
  attachQiFlowSvgInteractions(model);
  setQiFlowEmphasis(model);
}

function setQiFlowEmphasis(model, hoveredEdgeId = null, hoveredNodeKey = null) {
  const hoveredEdges = hoveredNodeKey
    ? new Set(model.edges.filter(edge => edge.from === hoveredNodeKey || edge.to === hoveredNodeKey).map(edge => edge.id))
    : hoveredEdgeId ? new Set([hoveredEdgeId]) : null;
  const highlightedNodes = new Set();
  if (hoveredEdges) {
    model.edges.filter(edge => hoveredEdges.has(edge.id)).forEach(edge => { highlightedNodes.add(edge.from); highlightedNodes.add(edge.to); });
  } else if (qiFlowSelectedEdgeId) {
    const selected = model.edges.find(edge => edge.id === qiFlowSelectedEdgeId);
    if (selected) { highlightedNodes.add(selected.from); highlightedNodes.add(selected.to); }
  }
  stage.querySelectorAll(".qi-flow-edge-visible").forEach(path => {
    const selected = path.dataset.qiFlowEdge === qiFlowSelectedEdgeId;
    const highlighted = hoveredEdges?.has(path.dataset.qiFlowEdge) || false;
    path.classList.toggle("selected", selected);
    path.classList.toggle("highlight", highlighted);
    path.classList.toggle("dim", Boolean(hoveredEdges) && !highlighted);
  });
  stage.querySelectorAll(".qi-flow-edge-label").forEach(label => {
    label.classList.toggle("dim", Boolean(hoveredEdges) && !hoveredEdges.has(label.dataset.qiFlowEdge));
  });
  stage.querySelectorAll(".qi-flow-node").forEach(node => {
    const highlighted = highlightedNodes.has(node.dataset.qiFlowNodeKey);
    node.classList.toggle("highlight", highlighted);
    node.classList.toggle("dim", Boolean(hoveredEdges) && !highlighted);
  });
}

function renderQiFlowInspector(model) {
  const slot = document.getElementById("qiFlowInspector");
  if (!slot) return;
  const edge = model.edges.find(candidate => candidate.id === qiFlowSelectedEdgeId);
  if (!edge) {
    slot.innerHTML = `<div class="qi-flow-empty">Select a link to inspect the exact paragraphs moving along it.</div>`;
    return;
  }
  const allKeys = [...edge.paragraphKeys].sort(traceParagraphSort);
  const visibleKeys = qiFlowPaperFilter === "all" ? allKeys : allKeys.filter(key => key.startsWith(`${qiFlowPaperFilter}:`));
  const paperCounts = qiFlowPaperCounts(allKeys);
  const paperSummary = allPapers.map(paper => `<span class="qi-flow-inspector-paper"><span class="papers-legend-swatch" style="background:${paperColorById[paper.paper_id]}"></span>${escapeHtml(shortPaperLabel(paper))} <strong>${paperCounts[paper.paper_id] || 0}</strong></span>`).join("");
  const direction = edge.kind === "retained"
    ? model.currentStage.descriptor.kind === "revision" ? "Membership held constant during question revision" : "Retained in the selected QI-Prime"
    : edge.kind === "arrived" ? "Arrived in the selected QI-Prime" : "Departed from the selected QI-Prime";
  const route = `${edge.fromNode.label}: ${edge.fromNode.question} → ${edge.toNode.label}: ${edge.toNode.question}`;
  const cards = visibleKeys.map(key => {
    const delimiter = key.indexOf(":");
    const paperId = key.slice(0, delimiter);
    const unitId = key.slice(delimiter + 1);
    const paper = allPapers.find(candidate => candidate.paper_id === paperId);
    const unit = paragraphUnitLookup[key];
    return `<button type="button" class="qi-flow-paragraph" data-qi-flow-paragraph="${escapeHtml(key)}" data-paragraph-inspect="${escapeHtml(key)}" style="--paper-color:${paperColorById[paperId] || "#868e96"}">
      <div class="qi-flow-paragraph-meta">${escapeHtml(shortPaperLabel(paper || { paper_id: paperId }))} · ${escapeHtml(unitId)}</div>
      <div class="qi-flow-paragraph-question">${escapeHtml(unit?.tag || "(no paragraph question)")}</div>
      <div class="qi-flow-paragraph-text">${escapeHtml(compactText(unit?.text))}</div>
    </button>`;
  }).join("");
  slot.innerHTML = `<div class="qi-flow-inspector-head"><strong>${escapeHtml(direction)} · ${edge.paragraphKeys.length} paragraph${edge.paragraphKeys.length === 1 ? "" : "s"}</strong><span title="${escapeHtml(route)}">${escapeHtml(route)}</span><div class="qi-flow-inspector-papers">${paperSummary}</div></div>
    ${cards ? `<div class="qi-flow-paragraphs">${cards}</div>` : `<div class="qi-flow-empty">No paragraphs on this link match the paper filter.</div>`}`;
}

function attachQiFlowSvgInteractions(model) {
  stage.querySelectorAll("[data-qi-flow-edge]").forEach(element => {
    const edgeId = element.dataset.qiFlowEdge;
    if (element.classList.contains("qi-flow-dot")) return;
    element.addEventListener("mouseenter", () => setQiFlowEmphasis(model, edgeId));
    element.addEventListener("mouseleave", () => setQiFlowEmphasis(model));
    element.addEventListener("click", event => {
      event.stopPropagation();
      qiFlowSelectedEdgeId = edgeId;
      setQiFlowEmphasis(model);
      renderQiFlowInspector(model);
    });
  });
}

function stopQiFlowPlayback() {
  if (qiFlowTimer) clearInterval(qiFlowTimer);
  qiFlowTimer = null;
  qiFlowPlaying = false;
}

function qiFlowTransitionCount() {
  return Math.max(0, currentQiHistory().stages.length - 1);
}

function startQiFlowPlayback() {
  stopQiFlowPlayback();
  const transitionCount = qiFlowTransitionCount();
  if (qiFlowTransition >= transitionCount) qiFlowTransition = 1;
  qiFlowPlaying = true;
  qiFlowSelectedEdgeId = null;
  renderQiPrimeFlow();
  qiFlowTimer = setInterval(() => {
    if (qiFlowTransition >= transitionCount) {
      stopQiFlowPlayback();
      renderQiPrimeFlow({ animateDots: false });
      return;
    }
    qiFlowTransition += 1;
    qiFlowSelectedEdgeId = null;
    renderQiPrimeFlow();
  }, 2300);
}

function renderQiPrimeFlow({ animateDots = true } = {}) {
  const history = currentQiHistory();
  const qiPrimes = history.stages[0]?.groups || [];
  if (!qiPrimes.length) {
    stage.innerHTML = `<div class="empty-state">No baseline QI-Primes are available to animate for this history source.</div>`;
    return;
  }
  if (!traceSelectedGroupId || !traceGroupForIteration(0, traceSelectedGroupId)) traceSelectedGroupId = qiPrimes[0].group_id;
  const transitionCount = qiFlowTransitionCount();
  qiFlowTransition = Math.max(1, Math.min(transitionCount, qiFlowTransition));
  const model = buildQiPrimeFlowModel(traceSelectedGroupId, qiFlowTransition);
  qiFlowCurrentModel = model;
  if (qiFlowSelectedEdgeId && !model.edges.some(edge => edge.id === qiFlowSelectedEdgeId)) qiFlowSelectedEdgeId = null;
  if (!qiFlowSelectedEdgeId) qiFlowSelectedEdgeId = model.edges.find(edge => edge.kind === "retained")?.id || model.edges[0]?.id || null;
  const groupOptions = qiPrimes.map((group, index) => `<option value="${escapeHtml(group.group_id)}"${group.group_id === traceSelectedGroupId ? " selected" : ""}>QI-${index + 1} · ${escapeHtml(compactText(group.overarching_question))}</option>`).join("");
  const paperOptions = [`<option value="all"${qiFlowPaperFilter === "all" ? " selected" : ""}>All papers</option>`]
    .concat(allPapers.map(paper => `<option value="${escapeHtml(paper.paper_id)}"${qiFlowPaperFilter === paper.paper_id ? " selected" : ""}>${escapeHtml(shortPaperLabel(paper))}</option>`))
    .join("");
  const steps = Array.from({ length: transitionCount }, (_, index) => index + 1).map(transition => {
    const before = history.stages[transition - 1];
    const after = history.stages[transition];
    return `<button type="button" class="qi-flow-step-button${transition === qiFlowTransition ? " active" : ""}" data-qi-flow-transition="${transition}">${escapeHtml(before.shortLabel)} &rarr; ${escapeHtml(after.shortLabel)}</button>`;
  }).join("");
  const provenance = history.key === "epochs"
    ? "Moving dots appear during E-step assignment changes. M-step question revisions hold paragraph membership fixed and do not animate movement."
    : "These snapshots combine reassignment and question revision, so moving dots represent only the deterministic membership difference.";
  stage.innerHTML = `<div class="qi-flow-shell">
    <div class="qi-flow-toolbar">
      <label class="qi-history-source-control"><span class="qi-trace-control-label">History source</span><select id="qiFlowHistorySource">${qiHistorySourceOptions(qiHistorySource)}</select></label>
      <label class="qi-flow-question-control"><span class="qi-trace-control-label">${escapeHtml(history.baselineLabel)}</span><select id="qiFlowGroupSelect">${groupOptions}</select></label>
      <div class="qi-flow-playback" role="group" aria-label="Flow playback controls">
        <button type="button" class="qi-flow-control-button" id="qiFlowPrevious"${qiFlowTransition <= 1 ? " disabled" : ""}>Previous</button>
        <button type="button" class="qi-flow-control-button${qiFlowPlaying ? " active" : ""}" id="qiFlowPlay">${qiFlowPlaying ? "Pause" : "Play"}</button>
        <button type="button" class="qi-flow-control-button" id="qiFlowReplay">Replay</button>
        <button type="button" class="qi-flow-control-button" id="qiFlowNext"${qiFlowTransition >= transitionCount ? " disabled" : ""}>Next</button>
      </div>
      <div class="qi-flow-stepper" aria-label="Saved transitions">${steps}</div>
      <label class="qi-trace-control-label">Paragraph dots <select id="qiFlowPaperFilter" class="qi-flow-paper-select">${paperOptions}</select></label>
      <div class="qi-flow-provenance">Link width and numbered markers show paragraph count; moving dots use paper colors. ${escapeHtml(provenance)} Every link is a deterministic set difference between saved snapshots.</div>
    </div>
    ${renderQiFlowRevision(model, animateDots)}
    ${renderQiFlowCanvas(model)}
    <section class="qi-flow-inspector" id="qiFlowInspector"></section>
  </div>`;
  attachQiPrimeFlowInteractions(model);
  renderQiFlowInspector(model);
  requestAnimationFrame(() => drawQiPrimeFlowLinks(model, animateDots && model.currentStage.descriptor.movementEnabled));
}

function attachQiPrimeFlowInteractions(model) {
  const shell = stage.querySelector(".qi-flow-shell");
  if (shell) shell.addEventListener("click", event => event.stopPropagation());
  document.getElementById("qiFlowHistorySource")?.addEventListener("change", event => {
    stopQiFlowPlayback();
    qiHistorySource = event.target.value;
    traceSelectedGroupId = currentQiHistory().stages[0]?.groups?.[0]?.group_id || null;
    qiFlowTransition = 1;
    qiFlowSelectedEdgeId = null;
    refreshParagraphInspector();
    renderQiPrimeFlow();
  });
  document.getElementById("qiFlowGroupSelect")?.addEventListener("change", event => {
    stopQiFlowPlayback();
    traceSelectedGroupId = event.target.value;
    qiFlowSelectedEdgeId = null;
    renderQiPrimeFlow();
  });
  document.getElementById("qiFlowPaperFilter")?.addEventListener("change", event => {
    qiFlowPaperFilter = event.target.value;
    renderQiPrimeFlow();
  });
  document.getElementById("qiFlowPrevious")?.addEventListener("click", () => {
    stopQiFlowPlayback();
    qiFlowTransition = Math.max(1, qiFlowTransition - 1);
    qiFlowSelectedEdgeId = null;
    renderQiPrimeFlow();
  });
  document.getElementById("qiFlowNext")?.addEventListener("click", () => {
    stopQiFlowPlayback();
    qiFlowTransition = Math.min(qiFlowTransitionCount(), qiFlowTransition + 1);
    qiFlowSelectedEdgeId = null;
    renderQiPrimeFlow();
  });
  document.getElementById("qiFlowReplay")?.addEventListener("click", () => {
    stopQiFlowPlayback();
    renderQiPrimeFlow();
  });
  document.getElementById("qiFlowPlay")?.addEventListener("click", () => {
    if (qiFlowPlaying) {
      stopQiFlowPlayback();
      renderQiPrimeFlow({ animateDots: false });
    } else startQiFlowPlayback();
  });
  stage.querySelectorAll("[data-qi-flow-transition]").forEach(button => {
    button.addEventListener("click", () => {
      stopQiFlowPlayback();
      qiFlowTransition = Number(button.dataset.qiFlowTransition);
      qiFlowSelectedEdgeId = null;
      renderQiPrimeFlow();
    });
  });
  stage.querySelectorAll("[data-qi-flow-node-key]").forEach(node => {
    const nodeKey = node.dataset.qiFlowNodeKey;
    node.addEventListener("mouseenter", () => setQiFlowEmphasis(model, null, nodeKey));
    node.addEventListener("mouseleave", () => setQiFlowEmphasis(model));
  });
  stage.querySelectorAll("[data-qi-flow-target-group]").forEach(button => {
    button.addEventListener("click", () => {
      stopQiFlowPlayback();
      traceSelectedGroupId = button.dataset.qiFlowTargetGroup;
      qiFlowSelectedEdgeId = null;
      renderQiPrimeFlow();
    });
  });
}

// Recomputes currentLinks from rawLinksForGranularity + similarityThreshold, then
// fully re-renders. Shared by granularity switches and similarity-slider changes,
// since both change which links (and therefore which units) should be visible.
function applyFilterAndRender() {
  currentLinks = rawLinksForGranularity.filter(l => l.similarity >= similarityThreshold);
  pinnedId = null;
  expandedIds.clear();
  renderColumns(allPapers, currentGranularity);
  drawLinks(currentLinks);
  attachInteractions();
}

function switchGranularity(granularity) {
  if (currentGranularity === "qi-flow" && granularity !== "qi-flow") stopQiFlowPlayback();
  currentGranularity = granularity;
  refreshParagraphInspector();
  buildGranularityTabs();
  if (granularity === "groups") {
    renderIterationGroups();
    return;
  }
  if (granularity === "epoch_groups") {
    renderEpochGroups();
    return;
  }
  if (MILP_VARIANT_KEYS.includes(granularity)) {
    renderMilpGroups(granularity);
    return;
  }
  if (granularity === "paper-map") {
    renderPaperMap();
    return;
  }
  if (granularity === "qi-trace") {
    renderQiPrimeTrace();
    return;
  }
  if (granularity === "qi-flow") {
    renderQiPrimeFlow();
    return;
  }
  rawLinksForGranularity = allLinksByGranularity[granularity] || [];
  applyFilterAndRender();
}

async function init() {
  const { papers, links, iterations, balances, milpDataByVariant, epochHistories } = await loadAll();
  allPapers = papers;
  allLinksByGranularity = links;
  Object.entries(iterations).forEach(([n, state]) => {
    iterationGroups[n] = state.groups || [];
    iterationMeta[n] = state.meta || null;
  });
  Object.entries(balances).forEach(([iteration, groups]) => {
    groupBalanceByIteration[iteration] = {};
    groups.forEach(group => {
      groupBalanceByIteration[iteration][group.group_id] = group.group_balance;
    });
  });
  MILP_VARIANT_KEYS.forEach(key => {
    if (milpDataByVariant[key]) milpGroupsByVariant[key] = milpDataByVariant[key].groups || [];
  });
  epochHistoryDataBySource = epochHistories || {};
  const primaryEpochHistory = epochHistoryDataBySource.matrix1_reassign
    || epochHistoryDataBySource.epochs
    || { initialGroups: null, steps: {} };
  const primaryInitialGroups = epochInitialGroups(primaryEpochHistory.initialGroups);
  if (primaryInitialGroups.length) epochGroupsByPhase.initial = primaryInitialGroups;
  epochStepDataByPhase = primaryEpochHistory.steps || {};
  for (let n = 1; n <= N_EPOCH_PHASES; n++) {
    const phase = `epoch${n}`;
    const { estep, mstep, balance } = epochStepDataByPhase[phase] || {};
    if (!estep || !mstep) continue;
    epochMetaByPhase[phase] = estep.meta || null;
    const membersByGroupId = {};
    (estep.groups || []).forEach(g => { membersByGroupId[g.group_id] = g.members; });
    epochGroupsByPhase[phase] = (mstep.groups || []).map(g => ({
      group_id: g.group_id,
      overarching_question: g.overarching_question,
      members: membersByGroupId[g.group_id] || [],
    }));
    if (balance) {
      epochBalanceByPhase[phase] = {};
      balance.forEach(g => { epochBalanceByPhase[phase][g.group_id] = g.group_balance; });
    }
  }
  buildParagraphUnitLookup();
  buildPaperColors();
  buildQiHistorySources();
  traceSelectedGroupId = currentQiHistory().stages[0]?.groups?.[0]?.group_id || null;
  rawLinksForGranularity = links[currentGranularity] || [];

  buildGranularityTabs();
  applyFilterAndRender();

  document.addEventListener("click", event => {
    const trigger = event.target.closest?.("[data-paragraph-inspect]");
    if (!trigger) return;
    event.preventDefault();
    event.stopPropagation();
    toggleParagraphInspector(trigger.dataset.paragraphInspect);
  }, true);
  paragraphInspectorClose.addEventListener("click", closeParagraphInspector);
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && paragraphInspector.classList.contains("open")) closeParagraphInspector();
  });

  stage.addEventListener("click", () => {
    if (pinnedId) {
      pinnedId = null;
      refreshView();
    }
  });
  window.addEventListener("resize", () => {
    if (currentGranularity === "paper-map") updatePaperMapHeight();
    else if (currentGranularity === "qi-flow" && qiFlowCurrentModel) drawQiPrimeFlowLinks(qiFlowCurrentModel, false);
    else if (GRANULARITIES.includes(currentGranularity)) refreshView();
  });
  previewSlider.addEventListener("input", () => {
    previewChars = Number(previewSlider.value);
    previewValueEl.textContent = String(previewChars);
    if (currentGranularity === "groups") renderIterationGroups();
    else if (currentGranularity === "epoch_groups") renderEpochGroups();
    else if (MILP_VARIANT_KEYS.includes(currentGranularity)) renderMilpGroups(currentGranularity);
    else if (GRANULARITIES.includes(currentGranularity)) updatePreviews();
  });
  similaritySlider.addEventListener("input", () => {
    similarityThreshold = Number(similaritySlider.value);
    similarityValueEl.textContent = similarityThreshold.toFixed(2);
    if (GRANULARITIES.includes(currentGranularity)) applyFilterAndRender();
  });
}

init().catch(error => {
  console.error("Failed to initialize the viewer", error);
  const serverHint = window.location.protocol === "file:"
    ? "This viewer must be served over HTTP. From the repository root, run: python -m http.server 8743 --directory pipeline"
    : "Confirm that output/sections contains the manifest, paper, match, and iteration JSON files.";
  stage.innerHTML = `<div class="empty-state"><strong>Could not load viewer data.</strong><br>${escapeHtml(serverHint)}<br><small>${escapeHtml(error.message || error)}</small></div>`;
});
</script>
