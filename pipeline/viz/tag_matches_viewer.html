<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bidirectional Tag Match Viewer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    background: #fafafa;
    color: #212529;
  }
  header {
    position: sticky;
    top: 0;
    background: #fff;
    border-bottom: 1px solid #dee2e6;
    padding: 5px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    z-index: 20;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; color: #495057; }
  #legend {
    font-size: 10.5px;
    color: #868e96;
    padding: 4px 16px;
    background: #fff;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 31px;
    z-index: 19;
  }
  #stage { position: relative; padding: 10px 14px; }
  #linkLayer { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; }
  #columns { position: relative; z-index: 1; display: flex; gap: 56px; align-items: flex-start; }
  .column { flex: 1 1 0; min-width: 0; background: transparent; }
  .paper-title {
    font-size: 13px; font-weight: 700; color: #343a40;
    padding-bottom: 4px; margin-bottom: 6px; border-bottom: 2px solid #343a40;
  }
  .section-block {
    background: #fff;
    border: 1.5px solid #e9ecef;
    border-radius: 6px;
    padding: 6px 9px;
    margin-bottom: 5px;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  .section-block.linkable { cursor: pointer; }
  .section-block.highlight { border-color: #1c7ed6; box-shadow: 0 0 0 2px rgba(28,126,214,0.25); }
  .section-block.dim { opacity: 0.35; }
  .section-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
  .tag-badge {
    font-size: 11px; font-weight: 600; color: #343a40; background: #eef1f3;
    border: 1px solid #dee2e6; padding: 1px 7px; border-radius: 9px; white-space: normal;
    line-height: 1.3;
  }
  .section-title { font-size: 12.5px; font-weight: 600; color: #212529; }
  .relation-badge {
    font-size: 9.5px; font-style: italic; color: #495057; background: #f1f3f5;
    border: 1px solid #dee2e6; padding: 1px 6px; border-radius: 9px; white-space: nowrap;
  }
  .section-text { font-size: 12px; line-height: 1.35; color: #495057; white-space: normal; }
  .section-text-preview:empty { display: none; }
  .section-text-full { display: none; }
  .section-block.expanded .section-text-preview { display: none; }
  .section-block.expanded .section-text-full { display: block; }
  .expand-hint { font-size: 10px; color: #adb5bd; margin-top: 2px; }
  .section-block.expanded .expand-hint::after { content: "collapse ▴"; }
  .section-block:not(.expanded) .expand-hint::after { content: "click to expand ▾"; }
  .empty-state { padding: 40px; color: #868e96; font-size: 13px; }
  .granularity-btn {
    font-size: 11px; padding: 3px 10px; border: 1px solid #ced4da; background: #fff; color: #495057;
    cursor: pointer; border-radius: 0;
  }
  .granularity-btn:first-child { border-radius: 4px 0 0 4px; }
  .granularity-btn:last-child { border-radius: 0 4px 4px 0; }
  .granularity-btn:not(:first-child) { border-left: none; }
  .granularity-btn.active { background: #1c7ed6; color: #fff; border-color: #1c7ed6; }

  .iteration-tabs { display: flex; gap: 2px; margin-bottom: 4px; }
  .iteration-meta { font-size: 11px; color: #868e96; margin-bottom: 8px; }
  .papers-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #495057; margin-bottom: 14px; }
  .papers-legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .papers-legend-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }

  .group-card {
    background: #fff; border: 1px solid #e9ecef; border-radius: 6px;
    padding: 3px 10px; margin-bottom: 2px;
  }
  .group-card.open { padding-bottom: 8px; margin-bottom: 8px; }
  .group-question {
    font-size: 13px; font-weight: 700; color: #212529; cursor: pointer; display: inline-block;
  }
  .group-question:hover { color: #1c7ed6; }
  .group-question::before { content: "▸ "; color: #adb5bd; }
  .group-card.open .group-question::before { content: "▾ "; }
  .group-balance-badge {
    font-size: 10px; font-weight: 600; color: #495057; background: #f1f3f5;
    border: 1px solid #dee2e6; padding: 1px 6px; border-radius: 9px; margin-left: 6px; vertical-align: middle;
  }
  .group-unit-vis { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; max-width: 100%; }
  .unit-square { box-sizing: border-box; width: 8px; height: 8px; border-radius: 1.5px; flex: none; }
  .unit-square.represented { background: var(--paper-color); }
  .unit-square.missing { background: transparent; border: 1px dashed var(--paper-color); }
  .group-card.open .group-unit-vis { display: none; }
  .group-detail-slot { margin-top: 10px; }
  .group-columns-wrap { position: relative; }
  .group-columns { display: flex; gap: 30px; align-items: flex-start; }
  .group-columns .column { flex: 1 1 0; min-width: 0; text-align: left; }
  .group-columns .paper-title { font-size: 11px; }
  .group-column-empty { font-size: 11.5px; color: #adb5bd; font-style: italic; padding: 6px 2px; }

  .paper-map-shell {
    display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 520px;
    border: 1px solid #dee2e6; border-radius: 6px; background: #fff; overflow: hidden;
  }
  .paper-map-overview {
    display: grid; gap: 6px; min-width: 0; padding: 7px 9px;
    border-bottom: 1px solid #e9ecef; background: #f8f9fa;
  }
  .paper-map-control-row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .paper-map-control-row .iteration-tabs { margin: 0; }
  .paper-map-summary { color: #6c757d; font-size: 10px; white-space: nowrap; }
  .paper-map-mode-toggle { display: inline-flex; border: 1px solid #ced4da; border-radius: 5px; overflow: hidden; }
  .paper-map-mode-button {
    padding: 3px 7px; border: 0; border-right: 1px solid #ced4da; background: #fff;
    color: #495057; font-size: 9.5px; cursor: pointer;
  }
  .paper-map-mode-button:last-child { border-right: 0; }
  .paper-map-mode-button.active { background: #1c7ed6; color: #fff; }
  .paper-map-sync-toggle {
    display: inline-flex; align-items: center; gap: 5px; color: #495057;
    font-size: 9.5px; white-space: nowrap;
  }
  .paper-map-legend { display: flex; gap: 5px; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .paper-map-legend-item {
    display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; max-width: 235px;
    padding: 3px 7px; border: 1px solid #dee2e6; border-radius: 10px; background: #fff;
    color: #495057; font-size: 9.5px; text-align: left; cursor: pointer;
  }
  .paper-map-legend-item:hover, .paper-map-legend-item.highlight, .paper-map-legend-item.selected {
    border-color: var(--group-color); box-shadow: inset 0 0 0 1px var(--group-color);
  }
  .paper-map-legend-item.selected { background: var(--group-fill); }
  .paper-map-swatch { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 2px; background: var(--group-color); }
  .paper-map-legend-item strong { flex: none; white-space: nowrap; }
  .paper-map-legend-question { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .paper-map-legend-count { color: #868e96; }
  .paper-map-columns {
    display: grid; grid-template-columns: repeat(var(--paper-count), minmax(320px, 1fr));
    gap: 10px; min-height: 0; padding: 10px; overflow-x: auto; background: #fafafa;
  }
  .paper-map-column {
    min-width: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
    border: 1px solid #dee2e6; border-radius: 6px; background: #fff;
  }
  .paper-map-paper-head {
    position: sticky; top: 0; z-index: 3; padding: 8px 10px; border-bottom: 2px solid #343a40;
    background: rgba(255,255,255,.97); color: #343a40; font-size: 13px; font-weight: 700;
  }
  .paper-map-section-head {
    margin: 11px 9px 5px; padding-bottom: 4px; border-bottom: 1px solid #dee2e6;
    color: #495057; font-size: 10.5px; font-weight: 700;
  }
  .paper-map-paragraph {
    margin: 0 8px 7px; padding: 8px 9px; border: 1px solid var(--group-color);
    border-left-width: 5px; border-radius: 5px; background: var(--group-fill); cursor: pointer;
    transition: opacity .12s ease, box-shadow .12s ease;
  }
  .paper-map-paragraph:hover, .paper-map-paragraph.highlight { box-shadow: 0 0 0 2px var(--group-color); }
  .paper-map-paragraph.dim, .paper-map-legend-item.dim { opacity: .24; }
  .paper-map-paragraph.orphan {
    --group-color: #adb5bd; --group-fill: #f8f9fa; border-style: dashed;
  }
  .paper-map-paragraph-meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; color: #868e96; font-size: 8.5px; }
  .paper-map-paragraph-question { margin-bottom: 4px; color: #343a40; font-size: 11px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
  .paper-map-paragraph-text { color: #495057; font-size: 10.5px; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }

  .paper-map-skeleton-columns {
    display: grid; grid-template-columns: repeat(var(--paper-count), minmax(220px, 1fr));
    gap: 18px; min-height: 0; padding: 14px 22px 18px; overflow: auto; background: #fafafa;
  }
  .paper-map-skeleton-paper {
    display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0;
    border: 1px solid #dee2e6; border-radius: 6px; background: #fff; overflow: hidden;
  }
  .paper-map-skeleton-frame { min-height: 0; padding: 8px; background: #f8f9fa; }
  .paper-map-skeleton-track {
    display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 380px;
    border: 1px solid #ced4da; border-radius: 3px; background: #fff; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .paper-map-skeleton-block {
    position: relative; flex: var(--paragraph-weight) 1 0; min-height: 1px; width: 100%; border: 0;
    padding: 0; background: var(--group-color); cursor: pointer;
    box-shadow: inset 0 -1px rgba(255,255,255,.25);
    transition: opacity .12s ease, filter .12s ease;
  }
  .paper-map-skeleton-block:hover, .paper-map-skeleton-block.highlight { z-index: 1; filter: saturate(1.22) brightness(1.05); }
  .paper-map-skeleton-block.selected { z-index: 2; box-shadow: inset 0 0 0 2px #212529; }
  .paper-map-skeleton-block.dim { opacity: .14; filter: saturate(.45); }
  .paper-map-skeleton-block.orphan {
    --group-color: #ced4da;
    background: repeating-linear-gradient(-45deg, #ced4da 0, #ced4da 3px, #f1f3f5 3px, #f1f3f5 6px);
  }
</style>
</head>
<body>

<header>
  <h1>Bidirectional Tag Match Viewer</h1>
  <div id="granularityTabs" style="display:flex;gap:2px;"></div>
  <label style="font-size:11px;color:#495057;display:flex;align-items:center;gap:6px;">
    preview length
    <input type="range" id="previewSlider" min="0" max="200" step="10" value="200">
    <span id="previewValue">200</span>
  </label>
  <label style="font-size:11px;color:#495057;display:flex;align-items:center;gap:6px;">
    min similarity
    <input type="range" id="similaritySlider" min="0" max="1" step="0.01" value="0">
    <span id="similarityValue">0.00</span>
  </label>
  <span style="font-size:11px;color:#868e96;">hover a unit to preview its links; click to pin and expand full text</span>
</header>
<div id="legend">tags are free-text questions/phrases, not a fixed category. Only <strong>bidirectional</strong> matches (mutual top-3) are shown; use the slider above to filter out weaker matches.</div>
<div id="stage"><div class="empty-state">Loading...</div></div>

<script>
const GRANULARITIES = ["sections", "paragraphs"]; // matching/data granularities
const GRANULARITY_LABELS = { sections: "Section", paragraphs: "Paragraph" };
const TABS = ["sections", "paragraphs", "groups", "paper-map"]; // display-only views are not matching granularities
const TAB_LABELS = { sections: "Section", paragraphs: "Paragraph", groups: "Groups", "paper-map": "Paper Map" };

const stage = document.getElementById("stage");
const granularityTabsEl = document.getElementById("granularityTabs");
const previewSlider = document.getElementById("previewSlider");
const previewValueEl = document.getElementById("previewValue");
const similaritySlider = document.getElementById("similaritySlider");
const similarityValueEl = document.getElementById("similarityValue");
let pinnedId = null;
let currentLinks = []; // links for the current granularity AND above the current similarity threshold
const expandedIds = new Set(); // units expanded to full text -- independent per unit, click toggles membership
let previewChars = Number(previewSlider.value);
let similarityThreshold = Number(similaritySlider.value);
const sectionTextById = {}; // id -> normalized full text, for live preview-length updates

let allPapers = [];
let allLinksByGranularity = { sections: [], paragraphs: [] };
let rawLinksForGranularity = []; // all links for the current granularity, before the similarity filter
let currentGranularity = "sections"; // matching is always within one granularity: sections<->sections, paragraphs<->paragraphs

let paragraphUnitLookup = {}; // "paper_id:unit_id" -> full paragraph object, for group-detail rendering

const N_ITERATIONS = 5;
let iterationGroups = {}; // iteration number -> [{group_id, members, overarching_question}, ...]
let iterationMeta = {}; // iteration number -> {reassigned, total_assigned}
let groupBalanceByIteration = {}; // iteration number -> {group_id: group_balance}, when available (currently iteration 1 only)
let currentIteration = 1;
const openGroupIds = new Set(); // group_id currently expanded to show its 3-column quote detail (within the current iteration)

const PAPER_MAP_HUES = [205, 25, 145, 48, 275, 175, 350, 95, 230, 8, 160, 62, 305, 190, 330, 118];
let paperMapMode = "reading";
let paperMapSelectedGroupId = null;
let paperMapSyncScroll = false;
let paperMapLastScrolledPaper = null;
let paperMapScrollSyncing = false;
const paperMapScrollByPaper = {};

// Fixed per-paper colors (not tag-derived, so this isn't the hash-based tag
// coloring that was removed earlier -- paper identity is a small, fixed,
// meaningful set) for the collapsed-group unit vis: one small square per
// quote, colored by which paper it's from.
const PAPER_COLOR_PALETTE = ["#4C6EF5", "#F76707", "#37b24d", "#e64980", "#ae3ec9", "#f59f00"];
let paperColorById = {};
let paperTitleById = {};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function preview(text, maxChars) {
  if (maxChars <= 0) return "";
  return text.length > maxChars ? text.slice(0, maxChars) + "…" : text;
}

function compactText(value) {
  return String(value || "").replace(/\s+/g, " ").trim();
}

function shortPaperLabel(paper) {
  const id = paper.paper_id || "";
  return id.replace(/_(?:[a-z]+)?\d{2,4}$/i, "").replace(/[_-]+/g, " ") || id;
}

function updatePreviews() {
  stage.querySelectorAll(".section-block").forEach(el => {
    const text = sectionTextById[el.dataset.id] || "";
    const previewEl = el.querySelector(".section-text-preview");
    if (previewEl) previewEl.textContent = preview(text, previewChars);
  });
  refreshView(); // preview height changed, so link endpoints moved
}

async function loadAll() {
  const base = "../output/sections/";
  const opts = { cache: "no-store" }; // these files change often during development; never serve a stale cached copy
  const manifest = await (await fetch(base + "manifest.json", opts)).json();
  const papers = [];
  for (const m of manifest) {
    papers.push(await (await fetch(base + m.file, opts)).json());
  }
  const links = await (await fetch(base + "bidirectional_matches.json", opts)).json();
  const iterations = {};
  for (let i = 1; i <= N_ITERATIONS; i++) {
    const state = await (await fetch(base + `paragraph_groups_iter${i}.json`, opts)).json();
    iterations[i] = state;
  }
  // Only iteration 1 currently has a computed group-balance metric -- fetch
  // it best-effort so older/other output directories without it don't break.
  let groupBalanceIter1 = null;
  try {
    const res = await fetch(base + "group_balance_iter1.json", opts);
    if (res.ok) groupBalanceIter1 = await res.json();
  } catch (e) { /* no group-balance file available -- fall back to default order */ }
  return { papers, links, iterations, groupBalanceIter1 };
}

function buildParagraphUnitLookup() {
  paragraphUnitLookup = {};
  allPapers.forEach(paper => {
    (paper.paragraphs || []).forEach(unit => {
      paragraphUnitLookup[`${paper.paper_id}:${unit.id}`] = unit;
    });
  });
}

function buildPaperColors() {
  paperColorById = {};
  paperTitleById = {};
  allPapers.forEach((paper, i) => {
    paperColorById[paper.paper_id] = PAPER_COLOR_PALETTE[i % PAPER_COLOR_PALETTE.length];
    paperTitleById[paper.paper_id] = paper.title;
  });
}

// One marker per paper: filled when at least one of that paper's paragraphs
// belongs to the group, dashed when the group has no paragraph from it.
function buildPaperCoverageVis(members) {
  const memberCountByPaper = {};
  members.forEach(member => {
    memberCountByPaper[member.paper] = (memberCountByPaper[member.paper] || 0) + 1;
  });
  const squares = allPapers.map(paper => {
    const count = memberCountByPaper[paper.paper_id] || 0;
    const state = count ? "represented" : "missing";
    const description = count
      ? `${paper.title}: represented by ${count} paragraph${count === 1 ? "" : "s"}`
      : `${paper.title}: no paragraphs assigned to this question`;
    return `<span class="unit-square ${state}" style="--paper-color:${paperColorById[paper.paper_id] || "#ced4da"}" title="${escapeHtml(description)}"></span>`;
  }).join("");
  return `<div class="group-unit-vis">${squares}</div>`;
}

function buildPapersLegend() {
  return `<div class="papers-legend">${allPapers.map(paper =>
    `<span class="papers-legend-item"><span class="papers-legend-swatch" style="background:${paperColorById[paper.paper_id]}"></span>${escapeHtml(paper.title)}</span>`
  ).join("")}</div>`;
}

function linkedIdSet(links) {
  const ids = new Set();
  links.forEach(l => {
    ids.add(`${l.paper_a}:${l.section_a}`);
    ids.add(`${l.paper_b}:${l.section_b}`);
  });
  return ids;
}

function renderColumns(papers, granularity) {
  // Only units that have at least one bidirectional match are shown -- an
  // unmatched section/paragraph is pruned from view entirely.
  const linked = linkedIdSet(currentLinks);
  const cols = papers.map(paper => {
    const units = (paper[granularity] || []).filter(sec => linked.has(`${paper.paper_id}:${sec.id}`));
    const blocks = units.map(sec => {
      const text = (sec.text || "").replace(/\s+/g, " ").trim();
      const id = `${paper.paper_id}:${sec.id}`;
      sectionTextById[id] = text;
      const previewText = preview(text, previewChars);
      const titleHtml = sec.title ? `<span class="section-title">${escapeHtml(sec.title)}</span>` : "";
      // prev_relation/next_relation only exist at paragraph granularity (always "" for sections)
      const prevHtml = sec.prev_relation ? `<span class="relation-badge">← ${escapeHtml(sec.prev_relation)}</span>` : "";
      const nextHtml = sec.next_relation ? `<span class="relation-badge">${escapeHtml(sec.next_relation)} →</span>` : "";
      return `<div class="section-block linkable" data-id="${id}">
        <div class="section-head">
          <span class="tag-badge">${escapeHtml(sec.tag)}</span>
          ${titleHtml}
          ${prevHtml}
          ${nextHtml}
        </div>
        <div class="section-text section-text-preview">${escapeHtml(previewText)}</div>
        <div class="section-text section-text-full">${escapeHtml(text)}</div>
        <div class="expand-hint"></div>
      </div>`;
    }).join("");
    return `<div class="column" data-paper="${paper.paper_id}">
      <div class="paper-title">${escapeHtml(paper.title)}</div>
      ${blocks}
    </div>`;
  }).join("");

  stage.innerHTML = `<svg id="linkLayer"></svg><div id="columns">${cols}</div>`;
}

function elFor(id) {
  return stage.querySelector(`.section-block[data-id="${CSS.escape(id)}"]`);
}

function drawLinks(links) {
  const svg = document.getElementById("linkLayer");
  const stageRect = stage.getBoundingClientRect();
  const columnsEl = document.getElementById("columns");
  // scrollWidth/Height (not offsetWidth/Height) -- offset* clamps to the
  // element's own box, which can be narrower than its rendered content when
  // children overflow it, silently clipping any link endpoint beyond that.
  const height = columnsEl.scrollHeight;
  const width = columnsEl.scrollWidth;
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const paths = links.map(link => {
    const aId = `${link.paper_a}:${link.section_a}`;
    const bId = `${link.paper_b}:${link.section_b}`;
    const aEl = elFor(aId), bEl = elFor(bId);
    if (!aEl || !bEl) return "";
    const aRect = aEl.getBoundingClientRect(), bRect = bEl.getBoundingClientRect();
    const aOnLeft = aRect.left < bRect.left;
    const x1 = (aOnLeft ? aRect.right : aRect.left) - stageRect.left;
    const y1 = aRect.top + aRect.height / 2 - stageRect.top;
    const x2 = (aOnLeft ? bRect.left : bRect.right) - stageRect.left;
    const y2 = bRect.top + bRect.height / 2 - stageRect.top;
    const cx = (x1 + x2) / 2;
    const opacity = 0.15 + 0.3 * link.similarity;
    // const opacity = 0.25;
    const baseWidth = 1 + 2.5 * link.similarity; // ribbon width scales with confidence, Sankey-style
    return `<path class="link-edge" data-a="${aId}" data-b="${bId}" data-base-width="${baseWidth}" data-similarity="${link.similarity}" ` +
      `d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}" ` +
      `stroke="#495057" stroke-width="${baseWidth}" fill="none" opacity="${opacity}"/>`;
  });
  svg.innerHTML = paths.join("");
}

const THICKENED_MIN_WIDTH = 25;  // px, given to the lowest-similarity link in the whole graph when thickened
const THICKENED_MAX_WIDTH = 50; // px, given to the highest-similarity link in the whole graph when thickened
const THICKENED_OPACITY = 0.15;

function similarityRange(links) {
  const sims = links.map(l => l.similarity);
  return { min: Math.min(...sims), max: Math.max(...sims) };
}

function applyHighlight(id) {
  const related = new Set([id]);
  currentLinks.forEach(link => {
    const aId = `${link.paper_a}:${link.section_a}`;
    const bId = `${link.paper_b}:${link.section_b}`;
    if (aId === id) related.add(bId);
    if (bId === id) related.add(aId);
  });
  stage.querySelectorAll(".section-block").forEach(el => {
    const isRelated = related.has(el.dataset.id);
    el.classList.toggle("highlight", isRelated && el.dataset.id !== id ? true : el.dataset.id === id);
    el.classList.toggle("dim", !isRelated);
  });
  const { min, max } = similarityRange(currentLinks);
  document.querySelectorAll(".link-edge").forEach(edge => {
    const touches = edge.dataset.a === id || edge.dataset.b === id;
    if (touches) {
      const sim = parseFloat(edge.dataset.similarity);
      const t = max > min ? (sim - min) / (max - min) : 1;
      const width = THICKENED_MIN_WIDTH + t * (THICKENED_MAX_WIDTH - THICKENED_MIN_WIDTH);
      edge.style.strokeWidth = width + "px";
      edge.style.opacity = THICKENED_OPACITY;
    } else {
      edge.style.strokeWidth = "";
      edge.style.opacity = 0.05;
    }
  });
}

function resetEdgeStyles() {
  document.querySelectorAll(".link-edge").forEach(edge => {
    edge.style.opacity = "";
    edge.style.strokeWidth = "";
  });
}

function clearTransientHighlight() {
  stage.querySelectorAll(".section-block").forEach(el => el.classList.remove("highlight", "dim"));
  resetEdgeStyles();
}

function setExpanded(id, expanded) {
  const el = elFor(id);
  if (el) el.classList.toggle("expanded", expanded);
}

function clearAlignment() {
  document.querySelectorAll(".column").forEach(col => { col.style.paddingTop = ""; });
}

// Re-flow every OTHER column so that whichever of its units is linked to the
// anchor lands on the anchor's own row, while every unit before/after that
// linked one keeps its normal relative order -- implemented by padding the
// top of each column (never reordering DOM children), so within-paper order
// is always preserved. A column with no link to the anchor is left alone.
function computeAndApplyAlignment(anchorId) {
  clearAlignment(); // undo any previous alignment before measuring natural positions
  const anchorEl = elFor(anchorId);
  if (!anchorEl) return;
  const stageRect = stage.getBoundingClientRect();
  const anchorY = anchorEl.getBoundingClientRect().top - stageRect.top;
  const anchorPaper = anchorId.split(":")[0];

  const partnerForPaper = {}; // other paper id -> the one unit in it linked to the anchor
  currentLinks.forEach(l => {
    const aId = `${l.paper_a}:${l.section_a}`;
    const bId = `${l.paper_b}:${l.section_b}`;
    if (aId === anchorId && !(l.paper_b in partnerForPaper)) partnerForPaper[l.paper_b] = bId;
    if (bId === anchorId && !(l.paper_a in partnerForPaper)) partnerForPaper[l.paper_a] = aId;
  });

  const offsets = { [anchorPaper]: 0 };
  Object.entries(partnerForPaper).forEach(([paperId, linkedId]) => {
    const linkedEl = elFor(linkedId);
    if (!linkedEl) return;
    const linkedY = linkedEl.getBoundingClientRect().top - stageRect.top;
    offsets[paperId] = anchorY - linkedY;
  });

  const globalMin = Math.min(0, ...Object.values(offsets));
  document.querySelectorAll(".column").forEach(col => {
    const paperId = col.dataset.paper;
    if (paperId in offsets) col.style.paddingTop = (offsets[paperId] - globalMin) + "px";
  });
}

function refreshView() {
  if (pinnedId) computeAndApplyAlignment(pinnedId);
  else clearAlignment();
  drawLinks(currentLinks);
  if (pinnedId) applyHighlight(pinnedId);
  else clearTransientHighlight();
}

function attachInteractions() {
  stage.querySelectorAll(".section-block").forEach(el => {
    const id = el.dataset.id;
    el.addEventListener("mouseenter", () => { if (!pinnedId) applyHighlight(id); });
    el.addEventListener("mouseleave", () => { if (!pinnedId) clearTransientHighlight(); });

    el.addEventListener("click", (evt) => {
      evt.stopPropagation();
      pinnedId = pinnedId === id ? null : id;
      refreshView();
    });

    const hint = el.querySelector(".expand-hint");
    if (hint) {
      hint.addEventListener("click", (evt) => {
        evt.stopPropagation();
        const isExpanded = expandedIds.has(id);
        if (isExpanded) { expandedIds.delete(id); setExpanded(id, false); }
        else { expandedIds.add(id); setExpanded(id, true); }
        refreshView(); // height changed, so link/alignment positions need recomputing
      });
    }
  });
}

function buildGranularityTabs() {
  granularityTabsEl.innerHTML = TABS.map(g =>
    `<button type="button" class="granularity-btn${g === currentGranularity ? " active" : ""}" data-granularity="${g}">${TAB_LABELS[g]}</button>`
  ).join("");
  granularityTabsEl.querySelectorAll(".granularity-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.granularity !== currentGranularity) switchGranularity(btn.dataset.granularity);
    });
  });
}

// Renders the iteration selector plus a flat list of that iteration's group
// cards, driven by currentIteration/openGroupIds. Any state change (an
// iteration switch, a card click, a slider change) just mutates that state
// and calls this again -- simpler than patching the DOM in place, and cheap
// since there's no API call involved.
function renderIterationGroups() {
  const tabsHtml = Array.from({ length: N_ITERATIONS }, (_, i) => i + 1).map(n =>
    `<button type="button" class="granularity-btn${n === currentIteration ? " active" : ""}" data-iteration="${n}">Iteration ${n}</button>`
  ).join("");

  const meta = iterationMeta[currentIteration];
  const metaText = meta ? `${meta.reassigned} of ${meta.total_assigned} paragraphs were reassigned to a different group this iteration.` : "";

  const balanceByGroupId = groupBalanceByIteration[currentIteration];
  // Sort a copy by group-balance (highest first) when available for this
  // iteration; otherwise keep the original (member-count-descending) order.
  const groups = balanceByGroupId
    ? [...(iterationGroups[currentIteration] || [])].sort((a, b) => (balanceByGroupId[b.group_id] ?? -1) - (balanceByGroupId[a.group_id] ?? -1))
    : (iterationGroups[currentIteration] || []);

  if (!groups.length) {
    stage.innerHTML = `<div class="iteration-tabs">${tabsHtml}</div><div class="empty-state">No groups available for this iteration.</div>`;
    attachIterationTabInteractions();
    return;
  }

  const cardsHtml = groups.map(group => {
    const balance = balanceByGroupId ? balanceByGroupId[group.group_id] : undefined;
    const balanceHtml = balance !== undefined ? `<span class="group-balance-badge">balance ${balance}%</span>` : "";
    return `<div class="group-card" data-group-id="${group.group_id}">
      <div class="group-question">${escapeHtml(group.overarching_question || "(no summary)")}${balanceHtml}</div>
      ${buildPaperCoverageVis(group.members)}
      <div class="group-detail-slot"></div>
    </div>`;
  }).join("");

  stage.innerHTML = `<div class="iteration-tabs">${tabsHtml}</div><div class="iteration-meta">${metaText}</div>${buildPapersLegend()}${cardsHtml}`;

  stage.querySelectorAll(".group-card").forEach(card => {
    const groupId = card.dataset.groupId;
    const group = groups.find(g => g.group_id === groupId);
    const slot = card.querySelector(".group-detail-slot");
    if (openGroupIds.has(groupId)) {
      card.classList.add("open");
      renderGroupDetail(slot, group);
    }
    card.querySelector(".group-question").addEventListener("click", () => {
      const isOpen = card.classList.toggle("open");
      if (isOpen) {
        openGroupIds.add(groupId);
        renderGroupDetail(slot, group);
      } else {
        openGroupIds.delete(groupId);
        slot.innerHTML = "";
      }
    });
  });

  attachIterationTabInteractions();
}

function attachIterationTabInteractions() {
  stage.querySelectorAll(".iteration-tabs .granularity-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const n = Number(btn.dataset.iteration);
      if (n !== currentIteration) switchIteration(n);
    });
  });
}

function switchIteration(n) {
  currentIteration = n;
  openGroupIds.clear(); // a group_id's membership/content differs across iterations, so don't carry an "open" state over
  if (currentGranularity === "paper-map") renderPaperMap();
  else renderIterationGroups();
}

function renderGroupDetail(slot, group) {
  const membersByPaper = {};
  group.members.forEach(m => {
    const unit = paragraphUnitLookup[`${m.paper}:${m.unit_id}`];
    if (!unit) return;
    (membersByPaper[m.paper] = membersByPaper[m.paper] || []).push(unit);
  });

  const cols = allPapers
    .map(paper => {
      const units = membersByPaper[paper.paper_id] || [];
      const blocks = units.map(unit => {
        const text = (unit.text || "").replace(/\s+/g, " ").trim();
        const id = `${paper.paper_id}:${unit.id}`;
        const previewText = preview(text, previewChars);
        const titleHtml = unit.title ? `<span class="section-title">${escapeHtml(unit.title)}</span>` : "";
        const prevHtml = unit.prev_relation ? `<span class="relation-badge">← ${escapeHtml(unit.prev_relation)}</span>` : "";
        const nextHtml = unit.next_relation ? `<span class="relation-badge">${escapeHtml(unit.next_relation)} →</span>` : "";
        return `<div class="section-block linkable" data-group-unit-id="${id}">
          <div class="section-head">
            <span class="tag-badge">${escapeHtml(unit.tag)}</span>
            ${titleHtml}
            ${prevHtml}
            ${nextHtml}
          </div>
          <div class="section-text section-text-preview">${escapeHtml(previewText)}</div>
          <div class="section-text section-text-full">${escapeHtml(text)}</div>
          <div class="expand-hint"></div>
        </div>`;
      }).join("");
      const bodyHtml = units.length ? blocks : `<div class="group-column-empty">no quotes in this group</div>`;
      return `<div class="column" data-paper="${paper.paper_id}">
        <div class="paper-title">${escapeHtml(paper.title)}</div>
        ${bodyHtml}
      </div>`;
    }).join("");

  slot.innerHTML = `<div class="group-columns-wrap"><div class="group-columns">${cols}</div></div>`;

  attachGroupInteractions(slot);
}

// Refined groups (paragraph_groups_iter<N>.json) don't carry pairwise link
// data the way quote_groups.json's groups did -- membership here comes from
// each paragraph's own best-fit choice, not from bidirectional matches
// between specific pairs -- so there's nothing to draw lines between or
// highlight by; the only interaction is expanding a quote's full text.
function attachGroupInteractions(slot) {
  slot.querySelectorAll(".section-block").forEach(el => {
    const hint = el.querySelector(".expand-hint");
    if (hint) {
      hint.addEventListener("click", (evt) => {
        evt.stopPropagation();
        el.classList.toggle("expanded");
      });
    }
  });
}

function paperMapColor(index) {
  const hue = PAPER_MAP_HUES[index % PAPER_MAP_HUES.length] + Math.floor(index / PAPER_MAP_HUES.length) * 11;
  return { border: `hsl(${hue % 360} 58% 38%)`, fill: `hsl(${hue % 360} 72% 95%)` };
}

function paperMapColorCatalog() {
  const groupIds = new Set();
  Object.values(iterationGroups).forEach(groups => {
    (groups || []).forEach(group => groupIds.add(group.group_id));
  });
  return new Map(
    [...groupIds]
      .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }))
      .map((groupId, index) => [groupId, paperMapColor(index)])
  );
}

// Iteration artifacts already contain one best-fit group per assigned
// paragraph. The map uses that membership directly instead of introducing a
// second ranking or matching rule in the viewer.
function buildPaperMapModel() {
  const groups = iterationGroups[currentIteration] || [];
  const colorByGroupId = paperMapColorCatalog();
  const groupEntries = groups.map((group, index) => ({
    group,
    label: `I${currentIteration}-${index + 1}`,
    color: colorByGroupId.get(group.group_id) || paperMapColor(index),
    count: 0,
  }));
  const entriesById = new Map(groupEntries.map(entry => [entry.group.group_id, entry]));
  const assignments = new Map();

  groupEntries.forEach(entry => {
    (entry.group.members || []).forEach(member => {
      const key = `${member.paper}:${member.unit_id}`;
      if (!paragraphUnitLookup[key] || assignments.has(key)) return;
      assignments.set(key, entry);
      entry.count += 1;
    });
  });

  return { groups, groupEntries, entriesById, assignments };
}

function renderPaperMap() {
  const model = buildPaperMapModel();
  if (paperMapSelectedGroupId && !model.entriesById.has(paperMapSelectedGroupId)) {
    paperMapSelectedGroupId = null;
  }

  const tabsHtml = Array.from({ length: N_ITERATIONS }, (_, i) => i + 1).map(n =>
    `<button type="button" class="granularity-btn${n === currentIteration ? " active" : ""}" data-iteration="${n}">Iteration ${n}</button>`
  ).join("");
  const totalParagraphs = allPapers.reduce((sum, paper) => sum + (paper.paragraphs || []).length, 0);
  const orphanCount = totalParagraphs - model.assignments.size;
  const legend = model.groupEntries.map(entry => {
    const groupId = entry.group.group_id;
    const question = entry.group.overarching_question || "(no summary)";
    const style = `--group-color:${entry.color.border};--group-fill:${entry.color.fill}`;
    const selected = paperMapSelectedGroupId === groupId;
    const title = `${entry.label} · ${question}`;
    return `<button type="button" class="paper-map-legend-item${selected ? " selected" : ""}" data-paper-map-group="${escapeHtml(groupId)}" style="${style}" title="${escapeHtml(title)}" aria-pressed="${selected}">
      <span class="paper-map-swatch"></span><strong>${escapeHtml(entry.label)}</strong><span class="paper-map-legend-question">${escapeHtml(question)}</span><span class="paper-map-legend-count">${entry.count}</span>
    </button>`;
  }).join("");
  const modeToggle = `<div class="paper-map-mode-toggle" role="group" aria-label="Paper Map display">
    <button type="button" class="paper-map-mode-button${paperMapMode === "reading" ? " active" : ""}" data-paper-map-mode="reading" aria-pressed="${paperMapMode === "reading"}">Read</button>
    <button type="button" class="paper-map-mode-button${paperMapMode === "skeleton" ? " active" : ""}" data-paper-map-mode="skeleton" aria-pressed="${paperMapMode === "skeleton"}">Skeleton</button>
  </div>`;
  const syncToggle = paperMapMode === "reading" ? `<label class="paper-map-sync-toggle" title="Off keeps each paper independently scrollable">
    <input type="checkbox" id="paperMapSyncScroll"${paperMapSyncScroll ? " checked" : ""}> sync paper scrolling
  </label>` : "";
  const content = paperMapMode === "skeleton" ? renderPaperMapSkeleton(model) : renderPaperMapReading(model);

  stage.innerHTML = `<div class="paper-map-shell">
    <div class="paper-map-overview">
      <div class="paper-map-control-row">
        <div class="iteration-tabs">${tabsHtml}</div>
        <div class="paper-map-summary"><strong>Iteration ${currentIteration}</strong> · ${model.groups.length} groups · ${model.assignments.size} assigned · ${orphanCount} unassigned</div>
        ${modeToggle}${syncToggle}
      </div>
      <div class="paper-map-legend" aria-label="Question groups at iteration ${currentIteration}">${legend}</div>
    </div>
    ${content}
  </div>`;

  attachPaperMapInteractions(model);
  requestAnimationFrame(() => {
    updatePaperMapHeight();
    if (paperMapMode !== "reading") return;
    const columns = [...stage.querySelectorAll(".paper-map-column")];
    paperMapScrollSyncing = true;
    columns.forEach(column => {
      const savedTop = paperMapScrollByPaper[column.dataset.paper] || 0;
      column.scrollTop = Math.min(savedTop, Math.max(0, column.scrollHeight - column.clientHeight));
    });
    if (paperMapSyncScroll && columns.length) {
      const source = columns.find(column => column.dataset.paper === paperMapLastScrolledPaper) || columns[0];
      const maximum = Math.max(0, source.scrollHeight - source.clientHeight);
      const ratio = maximum ? source.scrollTop / maximum : 0;
      columns.forEach(column => {
        const top = ratio * Math.max(0, column.scrollHeight - column.clientHeight);
        column.scrollTop = top;
        paperMapScrollByPaper[column.dataset.paper] = top;
      });
    }
    requestAnimationFrame(() => { paperMapScrollSyncing = false; });
  });
}

function renderPaperMapReading(model) {
  const columns = allPapers.map(paper => {
    const sections = new Map((paper.sections || []).map(section => [section.id, section]));
    let previousSectionId = null;
    const paragraphs = (paper.paragraphs || []).map(paragraph => {
      const key = `${paper.paper_id}:${paragraph.id}`;
      const entry = model.assignments.get(key);
      const groupId = entry ? entry.group.group_id : "";
      const style = entry ? `--group-color:${entry.color.border};--group-fill:${entry.color.fill}` : "";
      const sectionId = paragraph.section_id || paragraph.parent_section_id || "";
      let sectionHeading = "";
      if (sectionId !== previousSectionId) {
        previousSectionId = sectionId;
        const section = sections.get(sectionId);
        sectionHeading = `<div class="paper-map-section-head">${escapeHtml(section?.title || section?.tag || sectionId || "Unsectioned")}</div>`;
      }
      return `${sectionHeading}<article class="paper-map-paragraph${entry ? "" : " orphan"}" data-paper-map-paragraph="${escapeHtml(key)}" data-paper-map-group="${escapeHtml(groupId)}" style="${style}">
        <div class="paper-map-paragraph-meta"><span>${escapeHtml(paragraph.id)}</span><span>${entry ? escapeHtml(entry.label) : "Unassigned"}</span></div>
        <div class="paper-map-paragraph-question">${escapeHtml(paragraph.tag || "(no question)")}</div>
        <div class="paper-map-paragraph-text">${escapeHtml(compactText(paragraph.text))}</div>
      </article>`;
    }).join("");
    return `<section class="paper-map-column" data-paper="${escapeHtml(paper.paper_id)}">
      <div class="paper-map-paper-head" title="${escapeHtml(paper.title)}">${escapeHtml(shortPaperLabel(paper))} · ${(paper.paragraphs || []).length} paragraphs</div>${paragraphs}
    </section>`;
  }).join("");
  return `<div class="paper-map-columns" style="--paper-count:${allPapers.length}">${columns}</div>`;
}

function renderPaperMapSkeleton(model) {
  const papers = allPapers.map(paper => {
    const blocks = (paper.paragraphs || []).map(paragraph => {
      const key = `${paper.paper_id}:${paragraph.id}`;
      const entry = model.assignments.get(key);
      const groupId = entry ? entry.group.group_id : "";
      const characterCount = Math.max(1, compactText(paragraph.text).length);
      const label = entry ? entry.label : "Unassigned";
      const style = `${entry ? `--group-color:${entry.color.border};` : ""}--paragraph-weight:${characterCount}`;
      const title = `${paragraph.id} · ${label} · ${characterCount.toLocaleString()} characters`;
      return `<button type="button" class="paper-map-skeleton-block${entry ? "" : " orphan"}" data-paper-map-paragraph="${escapeHtml(key)}" data-paper-map-group="${escapeHtml(groupId)}" style="${style}" title="${escapeHtml(title)}" aria-label="${escapeHtml(`${shortPaperLabel(paper)} ${title}`)}"></button>`;
    }).join("");
    return `<section class="paper-map-skeleton-paper" data-paper="${escapeHtml(paper.paper_id)}">
      <div class="paper-map-paper-head" title="${escapeHtml(paper.title)}">${escapeHtml(shortPaperLabel(paper))} · ${(paper.paragraphs || []).length} paragraphs</div>
      <div class="paper-map-skeleton-frame"><div class="paper-map-skeleton-track">${blocks}</div></div>
    </section>`;
  }).join("");
  return `<div class="paper-map-skeleton-columns" style="--paper-count:${allPapers.length}">${papers}</div>`;
}

function updatePaperMapHeight() {
  const shell = stage.querySelector(".paper-map-shell");
  if (!shell) return;
  shell.style.height = `${Math.max(520, window.innerHeight - shell.getBoundingClientRect().top - 10)}px`;
}

function setPaperMapGroupEmphasis(hoveredGroupId = null) {
  const groupId = hoveredGroupId || paperMapSelectedGroupId;
  const active = Boolean(groupId);
  stage.querySelectorAll("[data-paper-map-group]").forEach(element => {
    const matches = element.dataset.paperMapGroup === groupId;
    element.classList.toggle("highlight", active && matches);
    element.classList.toggle("dim", active && !matches);
    if (element.classList.contains("paper-map-legend-item")) {
      const selected = element.dataset.paperMapGroup === paperMapSelectedGroupId;
      element.classList.toggle("selected", selected);
      element.setAttribute("aria-pressed", String(selected));
    }
    if (element.classList.contains("paper-map-skeleton-block")) {
      element.classList.toggle("selected", active && matches);
    }
  });
}

function syncPaperMapColumns(source, columns) {
  if (!paperMapSyncScroll || paperMapScrollSyncing) return;
  const maximum = Math.max(0, source.scrollHeight - source.clientHeight);
  const ratio = maximum ? source.scrollTop / maximum : 0;
  paperMapScrollSyncing = true;
  columns.forEach(target => {
    if (target === source) return;
    const top = ratio * Math.max(0, target.scrollHeight - target.clientHeight);
    target.scrollTop = top;
    paperMapScrollByPaper[target.dataset.paper] = top;
  });
  requestAnimationFrame(() => { paperMapScrollSyncing = false; });
}

function attachPaperMapInteractions(model) {
  const shell = stage.querySelector(".paper-map-shell");
  if (shell) shell.addEventListener("click", event => event.stopPropagation());
  attachIterationTabInteractions();
  stage.querySelectorAll("[data-paper-map-mode]").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      if (paperMapMode === button.dataset.paperMapMode) return;
      paperMapMode = button.dataset.paperMapMode;
      renderPaperMap();
    });
  });

  const columns = [...stage.querySelectorAll(".paper-map-column")];
  columns.forEach(column => {
    column.addEventListener("scroll", () => {
      if (paperMapScrollSyncing) return;
      paperMapLastScrolledPaper = column.dataset.paper;
      paperMapScrollByPaper[column.dataset.paper] = column.scrollTop;
      syncPaperMapColumns(column, columns);
    }, { passive: true });
  });
  const syncToggle = document.getElementById("paperMapSyncScroll");
  if (syncToggle) {
    syncToggle.addEventListener("change", event => {
      event.stopPropagation();
      paperMapSyncScroll = syncToggle.checked;
      if (!paperMapSyncScroll || !columns.length) return;
      const source = columns.find(column => column.dataset.paper === paperMapLastScrolledPaper) || columns[0];
      syncPaperMapColumns(source, columns);
    });
  }

  stage.querySelectorAll(".paper-map-paragraph, .paper-map-skeleton-block").forEach(card => {
    const groupId = card.dataset.paperMapGroup;
    card.addEventListener("mouseenter", () => setPaperMapGroupEmphasis(groupId));
    card.addEventListener("mouseleave", () => setPaperMapGroupEmphasis());
    card.addEventListener("click", event => {
      event.stopPropagation();
      paperMapSelectedGroupId = groupId && paperMapSelectedGroupId !== groupId ? groupId : null;
      setPaperMapGroupEmphasis();
    });
  });
  stage.querySelectorAll(".paper-map-legend-item").forEach(button => {
    const groupId = button.dataset.paperMapGroup;
    button.addEventListener("mouseenter", () => setPaperMapGroupEmphasis(groupId));
    button.addEventListener("mouseleave", () => setPaperMapGroupEmphasis());
    button.addEventListener("click", event => {
      event.stopPropagation();
      paperMapSelectedGroupId = paperMapSelectedGroupId === groupId ? null : groupId;
      setPaperMapGroupEmphasis();
    });
  });
  const content = stage.querySelector(".paper-map-columns, .paper-map-skeleton-columns");
  if (content) {
    content.addEventListener("click", event => {
      event.stopPropagation();
      paperMapSelectedGroupId = null;
      setPaperMapGroupEmphasis();
    });
  }
  setPaperMapGroupEmphasis();
}

// Recomputes currentLinks from rawLinksForGranularity + similarityThreshold, then
// fully re-renders. Shared by granularity switches and similarity-slider changes,
// since both change which links (and therefore which units) should be visible.
function applyFilterAndRender() {
  currentLinks = rawLinksForGranularity.filter(l => l.similarity >= similarityThreshold);
  pinnedId = null;
  expandedIds.clear();
  renderColumns(allPapers, currentGranularity);
  drawLinks(currentLinks);
  attachInteractions();
}

function switchGranularity(granularity) {
  currentGranularity = granularity;
  buildGranularityTabs();
  if (granularity === "groups") {
    renderIterationGroups();
    return;
  }
  if (granularity === "paper-map") {
    renderPaperMap();
    return;
  }
  rawLinksForGranularity = allLinksByGranularity[granularity] || [];
  applyFilterAndRender();
}

async function init() {
  const { papers, links, iterations, groupBalanceIter1 } = await loadAll();
  allPapers = papers;
  allLinksByGranularity = links;
  Object.entries(iterations).forEach(([n, state]) => {
    iterationGroups[n] = state.groups || [];
    iterationMeta[n] = state.meta || null;
  });
  if (groupBalanceIter1) {
    groupBalanceByIteration[1] = {};
    groupBalanceIter1.forEach(g => { groupBalanceByIteration[1][g.group_id] = g.group_balance; });
  }
  buildParagraphUnitLookup();
  buildPaperColors();
  rawLinksForGranularity = links[currentGranularity] || [];

  buildGranularityTabs();
  applyFilterAndRender();

  stage.addEventListener("click", () => {
    if (pinnedId) {
      pinnedId = null;
      refreshView();
    }
  });
  window.addEventListener("resize", () => {
    if (currentGranularity === "paper-map") updatePaperMapHeight();
    else if (currentGranularity !== "groups") refreshView();
  });
  previewSlider.addEventListener("input", () => {
    previewChars = Number(previewSlider.value);
    previewValueEl.textContent = String(previewChars);
    if (currentGranularity === "groups") renderIterationGroups();
    else if (GRANULARITIES.includes(currentGranularity)) updatePreviews();
  });
  similaritySlider.addEventListener("input", () => {
    similarityThreshold = Number(similaritySlider.value);
    similarityValueEl.textContent = similarityThreshold.toFixed(2);
    if (GRANULARITIES.includes(currentGranularity)) applyFilterAndRender();
  });
}

init().catch(error => {
  console.error("Failed to initialize the viewer", error);
  const serverHint = window.location.protocol === "file:"
    ? "This viewer must be served over HTTP. From the repository root, run: python -m http.server 8743 --directory pipeline"
    : "Confirm that output/sections contains the manifest, paper, match, and iteration JSON files.";
  stage.innerHTML = `<div class="empty-state"><strong>Could not load viewer data.</strong><br>${escapeHtml(serverHint)}<br><small>${escapeHtml(error.message || error)}</small></div>`;
});
</script>
</body>
</html>
