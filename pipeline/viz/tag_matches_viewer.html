  svg.setAttribute("width", columns.scrollWidth); svg.setAttribute("height", columns.scrollHeight);
  const origin = wrap.getBoundingClientRect(), scale = state.replayScale || 1;
  const x = rect => (rect.left + rect.width / 2 - origin.left) / scale;
  const top = rect => (rect.top - origin.top) / scale;
  const bottom = rect => (rect.bottom - origin.top) / scale;
  const treeEdges = [];
  detail.querySelectorAll(".group-columns .column").forEach(column => {
    const paperNode = column.querySelector(".paper-title");
    if (!paperNode) return;
    const paperRect = paperNode.getBoundingClientRect(), paperX = x(paperRect), paperTop = top(paperRect), paperBottom = bottom(paperRect);
    const cy = paperTop / 2;
    treeEdges.push(`<path class="detail-tree-edge" d="M ${columns.scrollWidth / 2} 0 C ${columns.scrollWidth / 2} ${cy}, ${paperX} ${cy}, ${paperX} ${paperTop}"/>`);
    column.querySelectorAll(".group-paragraph-card").forEach(card => {
      const cardRect = card.getBoundingClientRect(), cardX = x(cardRect), cardTop = top(cardRect), branchY = (paperBottom + cardTop) / 2;
      treeEdges.push(`<path class="detail-tree-edge" d="M ${paperX} ${paperBottom} C ${paperX} ${branchY}, ${cardX} ${branchY}, ${cardX} ${cardTop}"/>`);
    });
  });
  const matchEdges = (group.paragraph_links || group.links || []).map(link => {
    const aId = `${link.paper_a}:${link.section_a}`, bId = `${link.paper_b}:${link.section_b}`;
    const a = detail.querySelector(`[data-group-unit-id="${CSS.escape(aId)}"]`), b = detail.querySelector(`[data-group-unit-id="${CSS.escape(bId)}"]`);
    if (!a || !b) return "";
    const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect(), left = ar.left < br.left;
    const x1 = ((left ? ar.right : ar.left) - origin.left) / scale, y1 = (ar.top + ar.height / 2 - origin.top) / scale;
    const x2 = ((left ? br.left : br.right) - origin.left) / scale, y2 = (br.top + br.height / 2 - origin.top) / scale, cx = (x1 + x2) / 2;
    return `<path class="detail-link-edge" data-a="${escapeHtml(aId)}" data-b="${escapeHtml(bId)}" d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}" stroke-width="${1 + 2.5 * Number(link.similarity || 0)}" opacity="${.25 + .55 * Number(link.similarity || 0)}"/>`;
  });
  svg.innerHTML = [...treeEdges, ...matchEdges].join("");
}

function attachReplayDetailInteractions() {
  const detail = stage.querySelector(".replay-detail"); if (!detail) return;
  detail.querySelectorAll("[data-open-paragraph]").forEach(button => button.addEventListener("click", event => { event.stopPropagation(); openParagraphInspector(button.dataset.openParagraph); }));
  detail.querySelectorAll(".group-paragraph-card").forEach(card => {
    const id = card.dataset.groupUnitId;
    card.addEventListener("mouseenter", () => {
      const related = new Set([id]);
      detail.querySelectorAll(".detail-link-edge").forEach(edge => {
        if (edge.dataset.a === id) related.add(edge.dataset.b); if (edge.dataset.b === id) related.add(edge.dataset.a);
        edge.style.opacity = edge.dataset.a === id || edge.dataset.b === id ? ".9" : ".05";
      });
      detail.querySelectorAll(".group-paragraph-card").forEach(other => {
        other.classList.toggle("highlight", related.has(other.dataset.groupUnitId)); other.classList.toggle("dim", !related.has(other.dataset.groupUnitId));
      });
    });
    card.addEventListener("mouseleave", () => {
      detail.querySelectorAll(".group-paragraph-card").forEach(other => other.classList.remove("highlight", "dim"));
      detail.querySelectorAll(".detail-link-edge").forEach(edge => { edge.style.opacity = ""; });
    });
    card.querySelector(".expand-hint")?.addEventListener("click", event => { event.stopPropagation(); card.classList.toggle("expanded"); requestAnimationFrame(() => drawReplayDetailLinks(findReplayGroup(state.openReplayGroupId))); });
  });
  detail.querySelector(".replay-detail-scroll")?.addEventListener("wheel", event => event.stopPropagation());
}

function attachReplayInteractions() {
  stage.querySelectorAll(".replay-node[data-node-id]").forEach(node => {
    node.addEventListener("mouseenter", () => setReplayEdgeEmphasis(node.dataset.nodeId, true));
    node.addEventListener("mouseleave", () => setReplayEdgeEmphasis(node.dataset.nodeId, false));
    if (node.dataset.questionRevision) node.addEventListener("click", event => {
      if (event.target.closest("button")) return;
      const groupId = node.dataset.questionRevision;
      openGroupInspector(groupId, findReplayGroup(groupId), activeQuestionRevision(groupId));
    });
  });
  stage.querySelectorAll("[data-toggle-group]").forEach(button => button.addEventListener("click", event => {
    event.stopPropagation();
    const groupId = button.dataset.toggleGroup;
    const revision = activeQuestionRevision(groupId);
    state.openReplayGroupId = state.openReplayGroupId === groupId ? null : groupId;
    renderReplay(true);
    requestAnimationFrame(fitReplay);
    if (revision) openGroupInspector(groupId, findReplayGroup(groupId), revision);
  }));
  stage.querySelectorAll("[data-paragraph-key]").forEach(button => button.addEventListener("click", event => {
    event.stopPropagation(); openParagraphInspector(button.dataset.paragraphKey);
  }));
  attachReplayDetailInteractions();
  const viewport = $("replayViewport");
  let drag = null;
  viewport.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;
    event.preventDefault();
    drag = {x:event.clientX, y:event.clientY, originX:state.replayX, originY:state.replayY};
    viewport.setPointerCapture(event.pointerId); viewport.classList.add("dragging");
  });
  viewport.addEventListener("pointermove", event => {
    if (!drag) return;
    state.replayX = drag.originX + event.clientX - drag.x; state.replayY = drag.originY + event.clientY - drag.y; applyReplayTransform();
  });
  const end = () => { drag = null; viewport.classList.remove("dragging"); };
  viewport.addEventListener("pointerup", end); viewport.addEventListener("pointercancel", end);
  viewport.addEventListener("wheel", event => { if (event.target.closest(".replay-detail-scroll")) return; event.preventDefault(); zoomReplay(event.deltaY < 0 ? 1.08 : .92); }, {passive:false});
}

function syncInspectorSelection() {
  stage.querySelectorAll("[data-paper-map-paragraph]").forEach(element => {
    element.classList.toggle("inspected", state.inspectorSelection === `paragraph:${element.dataset.paperMapParagraph}`);
  });
  stage.querySelectorAll(".paper-map-legend-item").forEach(element => {
    element.classList.toggle("inspected", state.inspectorSelection === `group:${element.dataset.paperMapGroup}`);
  });
}

function closeInspector() {
  state.inspectorSelection = null;
  $("inspector").hidden = true;
  syncInspectorSelection();
}

function openParagraphInspector(key) {
  const unit = paragraphLookup[key]; if (!unit) return;
  const selection = `paragraph:${key}`;
  if (!$("inspector").hidden && state.inspectorSelection === selection) {
    closeInspector();
    return;
  }
  const paper = state.papers.find(item => item.paper_id === unit.paper);
  const section = paper?.sections?.find(item => item.id === unit.parent_section_id);
  const initialGroups = state.epochs?.initial_state?.groups || state.groups;
  const initialMemberships = initialGroups.filter(group => (group.members || []).some(member => paragraphKey(member) === key));
  const initialHistory = `<div class="history-row"><strong>Initial groups</strong> · ${initialMemberships.length ? initialMemberships.map(group => escapeHtml(groupDisplayLabel(group.group_id))).join(", ") : "unassigned"}</div>`;
  const epochHistory = (state.epochs?.epochs || []).map(epoch => {
    const groups = epoch.groups.filter(group => group.members.some(member => paragraphKey(member) === key));
    const decision = epoch.assignment_decisions?.find(item => paragraphKey(item) === key);
    return `<div class="history-row"><strong>Epoch ${epoch.epoch}</strong> · ${groups.length ? groups.map(group => escapeHtml(groupDisplayLabel(group.group_id))).join(", ") : "unassigned"}${decision?.reason ? `<br>${escapeHtml(decision.reason)}` : ""}</div>`;
  }).join("");
  $("inspectorTitle").textContent = `${shortPaperLabel(unit.paper)} · ${unit.id}`;
  $("inspectorBody").innerHTML = `<h2>${escapeHtml(unit.tag)}</h2><div class="inspector-meta">${escapeHtml(paper?.title || unit.paper)}<br>${escapeHtml(section?.title || unit.parent_section_id)}</div><h3>Complete source paragraph</h3><p>${escapeHtml(compactText(unit.text))}</p><h3>Assignment trajectory</h3>${initialHistory}${epochHistory}`;
  state.inspectorSelection = selection;
  $("inspector").hidden = false;
  syncInspectorSelection();
}

function findReplayGroup(groupId) {
  const step = state.replaySteps[state.replayIndex];
  return (step?.groups || []).find(group => group.group_id === groupId)
    || [...state.replaySteps].reverse().flatMap(item => item.groups || []).find(group => group.group_id === groupId)
    || groupLookup[groupId];
}

function activeQuestionRevision(groupId) {
  const step = state.replaySteps[state.replayIndex];
  const revision = (step?.revisions || []).find(item => item.group_id === groupId && item.changed);
  return revision ? {...revision, epoch:replayStepEpoch(step)} : null;
}

function openGroupInspector(groupId, preferredGroup = null, preferredRevision = null) {
  const group = preferredGroup || findReplayGroup(groupId); if (!group) return;
  const selection = `group:${groupId}`;
  if (!preferredRevision && !$("inspector").hidden && state.inspectorSelection === selection) {
    closeInspector();
    return;
  }
  const question = group.question || group.overarching_question || "(no question)";
  const labelInfo = groupLabelInfo(groupId);
  let members = group.members || [];
  if (group.super_group_id) {
    const keys = new Map();
    group.members.forEach(child => (groupLookup[child.group_id]?.members || []).forEach(member => keys.set(paragraphKey(member), member)));
    members = [...keys.values()];
  }
  const memberButtons = members.map(member => {
    const key = paragraphKey(member), unit = paragraphLookup[key];
    return unit ? `<button type="button" class="member-button" data-inspector-paragraph="${escapeHtml(key)}">${escapeHtml(unit.paper)} · ${escapeHtml(unit.tag)}</button>` : "";
  }).join("");
  const lineage = (state.epochs?.epochs || []).flatMap(epoch => epoch.groups.filter(item => item.group_id === groupId).map(item => `<div class="history-row"><strong>Epoch ${epoch.epoch} · ${escapeHtml(labelInfo.label)}</strong><br>${escapeHtml(item.question)}</div>`)).join("");
  const parentIds = labelInfo.parentGroupIds?.length
    ? labelInfo.parentGroupIds
    : (group.parent_group_ids || []).filter(parentId => parentId !== groupId);
  const parents = parentIds.map(parentId => `${groupDisplayLabel(parentId)} (${parentId})`).join(", ");
  const origin = labelInfo.originEpoch === 0 ? "Initial group" : `Created in epoch ${labelInfo.originEpoch}`;
  const revisionParagraphs = (preferredRevision?.new_paragraph_ids || []).map(key => {
    const unit = paragraphLookup[key];
    return unit ? `<button type="button" class="member-button" data-inspector-paragraph="${escapeHtml(key)}">${escapeHtml(shortPaperLabel(unit.paper))} · ${escapeHtml(unit.tag)}</button>` : "";
  }).join("");
  const lexicalSimilarity = Number(preferredRevision?.question_similarity);
  const revisionMeta = preferredRevision
    ? `<div class="inspector-meta">Epoch ${preferredRevision.epoch}${Number.isFinite(lexicalSimilarity) ? `<br>Lexical similarity: ${lexicalSimilarity.toFixed(4)}` : ""}<br>${(preferredRevision.new_paragraph_ids || []).length} newly assigned paragraph${(preferredRevision.new_paragraph_ids || []).length === 1 ? "" : "s"} considered</div>`
    : "";
  const revision = preferredRevision
    ? `<h3>Question revision</h3><div class="history-row"><strong>Previous question</strong><br>${escapeHtml(preferredRevision.previous_question || "(not recorded)")}</div><div class="history-row"><strong>Revised question</strong><br>${escapeHtml(preferredRevision.question || question)}</div>${revisionMeta}${revisionParagraphs ? `<h3>New evidence considered</h3>${revisionParagraphs}` : ""}`
    : "";
  $("inspectorTitle").textContent = `${labelInfo.label} · ${groupId}`;
  $("inspectorBody").innerHTML = `<h2>${escapeHtml(question)}</h2><div class="inspector-meta">${escapeHtml(origin)}<br>${members.length} paragraph memberships${parents ? `<br>Parent groups: ${escapeHtml(parents)}` : ""}</div>${revision}${lineage ? `<h3>Question lineage</h3>${lineage}` : ""}<h3>Source paragraphs</h3>${memberButtons || `<p>No paragraphs are attached in this view.</p>`}`;
  $("inspectorBody").querySelectorAll("[data-inspector-paragraph]").forEach(button => button.addEventListener("click", () => openParagraphInspector(button.dataset.inspectorParagraph)));
  state.inspectorSelection = selection;
  $("inspector").hidden = false;
  syncInspectorSelection();
}

function renderPaperPicker() {
  const library = state.libraryPapers.map(paper => `<label class="paper-option"><input class="paper-choice" type="checkbox" data-source="library" value="${escapeHtml(paper.paper_id)}"><span title="${escapeHtml(paper.filename)}">${escapeHtml(paper.paper_id)}</span></label>`);
  const uploads = state.uploads.map(paper => `<label class="paper-option"><input class="paper-choice" type="checkbox" data-source="upload" value="${escapeHtml(paper.upload_id)}" checked><span title="${escapeHtml(paper.filename)}">${escapeHtml(paper.paper_id)} [uploaded]</span></label>`);
  $("paperPicker").innerHTML = [...uploads, ...library].join("") || `<span class="run-state">No papers available yet.</span>`;
}

function renderSavedRuns() {
  const selectedRun = state.loadedRunId || $("savedRun").value;
  const resultRuns = state.runs.filter(run => run.has_results);
  const label = run => `${run.run_id}${run.experiment_label ? ` · ${run.experiment_label}` : ""} · ${run.status} · ${(run.papers || []).join(", ")}`;
  $("savedRun").innerHTML = `<option value="">Select a saved run</option>` + state.runs.map(run => `<option value="${escapeHtml(run.run_id)}"${run.has_results ? "" : " disabled"}>${escapeHtml(label(run))}${run.has_results ? "" : " · no replay artifacts"}</option>`).join("");
  if (state.runs.some(run => run.run_id === selectedRun && run.has_results)) $("savedRun").value = selectedRun;
  const selectedSource = $("sourceRun").value;
  $("sourceRun").innerHTML = `<option value="">Select a source run</option>` + resultRuns.map(run => `<option value="${escapeHtml(run.run_id)}">${escapeHtml(label(run))}</option>`).join("");
  if (resultRuns.some(run => run.run_id === selectedSource)) $("sourceRun").value = selectedSource;
}

async function openSelectedRun() {
  const runId = $("savedRun").value;
  if (!runId || runId === state.loadedRunId) return;
  $("runError").hidden = true;
  try {
    await loadRun(runId);
  } catch (error) {
    $("runError").hidden = false;
    $("runError").textContent = `Could not open ${runId}: ${error.message}`;
    $("analysisPanel").open = true;
  }
}

function applyDefaults(defaults) {
  const fields = {
    experiment_label:"experimentLabel", paragraph_context:"paragraphContext", assignment_context:"assignmentContext",
    reuse_scope:"reuseScope", source_run_id:"sourceRun",
    model:"model", max_epochs:"maxEpochs", section_weight:"sectionWeight",
    question_stability_threshold:"questionStability", section_context_max_chars:"sectionContext",
    paragraph_chunk_chars:"paragraphChunk", assignment_batch_chars:"assignmentBatch",
    representative_per_paper:"representativePerPaper", representative_max_per_group:"representativeMaxPerGroup", match_top_k:"matchTopK",
    section_group_threshold:"sectionThreshold", paragraph_group_threshold:"paragraphThreshold", supergroup_threshold:"supergroupThreshold",
  };
  Object.entries(fields).forEach(([key, id]) => { if (defaults[key] !== undefined) $(id).value = defaults[key]; });
  updateExperimentControls();
}

function updateExperimentControls() {
  const scope = $("reuseScope").value;
  $("sourceRun").disabled = scope === "fresh";
  if (scope === "fresh") $("sourceRun").value = "";
  if (scope === "pre_epoch") $("paragraphContext").value = "section";
  $("paragraphContext").disabled = scope === "pre_epoch";
  const representative = $("assignmentContext").value === "representative_group_paragraphs";
  $("representativePerPaper").disabled = !representative;
  $("representativeMaxPerGroup").disabled = !representative;
}

function applyRunStatus(status) {
  const running = status.status === "running";
  $("runState").textContent = status.stage?.label || status.status || "idle";
  $("startAnalysis").disabled = running;
  $("runLogWrap").hidden = !(status.logs || []).length;
  $("runLog").textContent = (status.logs || []).join("\n");
  $("runError").hidden = !status.error;
  $("runError").textContent = status.error || "";
}

async function refreshStatus() {
  const status = await fetchJson("/api/status"); applyRunStatus(status);
  if (status.status === "running") { state.statusTimer = setTimeout(refreshStatus, 1000); return; }
  state.statusTimer = null;
  if (status.status === "complete" && status.has_results && status.run_id !== state.loadedRunId) {
    const config = await fetchJson("/api/config");
    state.runs = config.runs || state.runs; renderSavedRuns();
    await loadRun(status.run_id, true);
  }
}

async function uploadPapers() {
  const files = [...$("paperUpload").files];
  if (!files.length) { $("uploadState").textContent = "Choose one or more PDFs."; return; }
  const form = new FormData(); files.forEach(file => form.append("files", file));
  $("uploadPapers").disabled = true; $("uploadState").textContent = "uploading…";
  try {
    const response = await fetchJson("/api/uploads", {method:"POST", body:form});
    state.uploads = [...response.uploads, ...state.uploads.filter(existing => !response.uploads.some(item => item.upload_id === existing.upload_id))];
    renderPaperPicker(); $("paperUpload").value = ""; $("uploadState").textContent = `${response.uploads.length} PDF${response.uploads.length === 1 ? "" : "s"} ready`;
  } catch (error) { $("uploadState").textContent = error.message; }
  finally { $("uploadPapers").disabled = false; }
}

function numberValue(id) { return Number($(id).value); }

async function startAnalysis() {
  const selected = [...document.querySelectorAll(".paper-choice:checked")];
  const paperIds = selected.filter(input => input.dataset.source === "library").map(input => input.value);
  const uploadIds = selected.filter(input => input.dataset.source === "upload").map(input => input.value);
  $("runError").hidden = true;
  try {
    const status = await fetchJson("/api/analyze", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
        paper_ids:paperIds, upload_ids:uploadIds, anthropic_api_key:$("apiKey").value.trim(), experiment_label:$("experimentLabel").value.trim(), model:$("model").value.trim(),
        paragraph_context:$("paragraphContext").value, assignment_context:$("assignmentContext").value,
        reuse_scope:$("reuseScope").value, source_run_id:$("sourceRun").value,
        max_epochs:numberValue("maxEpochs"), section_weight:numberValue("sectionWeight"),
        question_stability_threshold:numberValue("questionStability"), section_context_max_chars:numberValue("sectionContext"),
        paragraph_chunk_chars:numberValue("paragraphChunk"), assignment_batch_chars:numberValue("assignmentBatch"),
        representative_per_paper:numberValue("representativePerPaper"), representative_max_per_group:numberValue("representativeMaxPerGroup"), match_top_k:numberValue("matchTopK"),
        section_group_threshold:numberValue("sectionThreshold"), paragraph_group_threshold:numberValue("paragraphThreshold"), supergroup_threshold:numberValue("supergroupThreshold"),
      }),
    });
    $("apiKey").value = ""; state.runId = status.run_id; applyRunStatus(status); state.statusTimer = setTimeout(refreshStatus, 500);
  } catch (error) { $("runError").hidden = false; $("runError").textContent = error.message; }
}

async function init() {
  $("runForm").addEventListener("submit", event => event.preventDefault());
  $("previewSlider").addEventListener("input", () => { state.previewChars = numberValue("previewSlider"); $("previewValue").textContent = state.previewChars; if (state.tab === "sections" || state.tab === "paragraphs") renderAlignment(); });
  $("similaritySlider").addEventListener("input", () => { state.similarity = numberValue("similaritySlider"); $("similarityValue").textContent = state.similarity.toFixed(2); if (state.tab === "sections" || state.tab === "paragraphs") renderAlignment(); });
  $("showOrphans").addEventListener("change", renderCurrentView);
  $("membershipMode").addEventListener("change", () => renderReplay(false));
  $("shiftedOnly").addEventListener("change", () => renderReplay(false));
  $("prevStep").addEventListener("click", () => selectReplayStep(state.replayIndex - 1));
  $("nextStep").addEventListener("click", () => selectReplayStep(state.replayIndex + 1));
  $("replayStep").addEventListener("change", () => selectReplayStep(numberValue("replayStep")));
  $("fitReplay").addEventListener("click", fitReplay); $("zoomIn").addEventListener("click", () => zoomReplay(1.15)); $("zoomOut").addEventListener("click", () => zoomReplay(.87));
  $("inspectorClose").addEventListener("click", closeInspector);
  $("uploadPapers").addEventListener("click", uploadPapers); $("startAnalysis").addEventListener("click", startAnalysis);
  $("reuseScope").addEventListener("change", updateExperimentControls);
  $("assignmentContext").addEventListener("change", updateExperimentControls);
  $("savedRun").addEventListener("change", openSelectedRun);
  $("openRun").addEventListener("click", openSelectedRun);
  stage.addEventListener("click", event => {
    if (state.tab === "paper-map" && !event.target.closest("[data-paper-map-paragraph], .paper-map-legend-item, [data-paper-map-mode]")) {
      closeInspector();
    }
    if ((state.tab === "sections" || state.tab === "paragraphs") && state.pinnedAlignmentId) {
      state.pinnedAlignmentId = null;
      refreshAlignment(activeAlignmentLinks());
    }
  });
  document.addEventListener("keydown", event => { if (event.key === "Escape") closeInspector(); });
  window.addEventListener("resize", () => {
    if (state.tab === "groups") fitReplay();
    else if (state.tab === "paper-map") updatePaperMapHeight();
    else requestAnimationFrame(() => refreshAlignment(activeAlignmentLinks()));
  });

  try {
    const config = await fetchJson("/api/config");
    state.libraryPapers = config.papers || []; state.uploads = config.uploads || []; state.runs = config.runs || [];
    applyDefaults(config.defaults || {}); renderPaperPicker(); renderSavedRuns(); applyRunStatus(config.status || {});
    $("apiKey").placeholder = config.has_api_key ? "Using server key unless overridden" : "Required for this run";
    const requestedRunId = new URLSearchParams(window.location.search).get("run_id");
    const savedRunId = state.runs.some(run => run.run_id === requestedRunId && run.has_results)
      ? requestedRunId
      : config.status?.has_results && config.status.run_id
        ? config.status.run_id
        : state.runs.find(run => run.has_results)?.run_id;
    if (savedRunId) await loadRun(savedRunId);
    else { renderTabs(); renderCurrentView(); $("analysisPanel").open = true; }
    if (config.status?.status === "running") state.statusTimer = setTimeout(refreshStatus, 1000);
  } catch (error) {
    renderTabs(); stage.innerHTML = `<div class="empty-state">Start this viewer with <code>python analysis_server.py</code>, then open <a href="${LOCAL_SERVER_URL}">${LOCAL_SERVER_URL}</a>.<br>${escapeHtml(error.message)}</div>`;
    $("analysisPanel").open = true; $("runError").hidden = false; $("runError").textContent = "The local analysis API is unavailable.";
  }
}

if (!REDIRECT_FROM_FILE) init().catch(error => { stage.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`; });
</script>
</body>
</html>
