version: claude-skill-harness-v1
model: claude-sonnet-5
cache_dir: runs/_cache/skill-pipeline
output_dir: runs/skill-pipeline

# Stage order is execution order. A matching implementation is swapped by changing
# its skill and view here; the runner itself contains no matching judgment.
stages:
  - id: extraction
    kind: extract
    skill: extraction
  - id: questions
    kind: questions
    skill: questions
  - id: section_matching
    kind: match
    skill: section_matching
    view: sections
    max_tokens: 8192
    validation_attempts: 2
    output_suffix: section-mapping-by-paragraphs-and-questions
  - id: section_and_subsection_matching
    kind: match
    skill: section_and_subsection_matching
    view: sections_and_subsections
    max_tokens: 8192
    validation_attempts: 3
    source_batch_size: 1
    output_suffix: section-mapping-by-paragraphs-nested

skills:
  extraction: skills/extract-section-and-subsection-paragraphs
  questions: skills/annotate-section-questions-given-paragraphs
  section_matching: skills/directional-section-mapping-by-paragraphs-and-questions
  section_and_subsection_matching: skills/directional-section-mapping-by-paragraphs-nested

datasets:
  hci:
    question_documents: [examplore_chi18, corpusstudio]
    match_pair: [examplore_chi18, corpusstudio]
    documents:
      - id: examplore_chi18
        title: Examplore
        json: datasets/hci-five-paper/examplore_chi18-sections-with-subsections-and-paragraph-content-no-appendices.json
      - id: corpusstudio
        title: CorpusStudio
        json: datasets/hci-five-paper/corpusstudio-sections-with-subsections-and-paragraph-content-no-appendices.json
