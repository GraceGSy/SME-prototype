version: claude-skill-harness-v1
model: claude-sonnet-5
cache_dir: runs/skill-pipeline/cache
output_dir: runs/skill-pipeline/results

# Stage order is execution order. A matching implementation is swapped by changing
# its skill and view here; the runner itself contains no matching judgment.
stages:
  - id: extraction
    kind: extract
    skill: extraction
  - id: questions
    kind: questions
    skill: questions
  - id: section_matching
    kind: match
    skill: section_matching
    view: sections
    max_tokens: 8192
    validation_attempts: 2
    output_suffix: section-mapping-by-paragraphs-and-questions
  - id: section_and_subsection_matching
    kind: match
    skill: section_and_subsection_matching
    view: sections_and_subsections
    max_tokens: 8192
    validation_attempts: 3
    source_batch_size: 1
    output_suffix: section-mapping-by-paragraphs-nested

skills:
  extraction: skills/extract-section-and-subsection-paragraphs
  questions: skills/annotate-section-questions-given-paragraphs
  section_matching: skills/directional-section-mapping-by-paragraphs-and-questions
  section_and_subsection_matching: skills/directional-document-mapping-by-paragraphs-nested

datasets:
  sherlock:
    question_documents: [wisteria_lodge, bruce_partington_plans]
    match_pair: [wisteria_lodge, bruce_partington_plans]
    documents:
      - id: wisteria_lodge
        title: The Adventure of Wisteria Lodge
        xhtml:
          url: https://raw.githubusercontent.com/standardebooks/arthur-conan-doyle_his-last-bow/8ab7fce0e6f5e7d25cb1de9660b4fa6dd89a933c/src/epub/text/the-adventure-of-wisteria-lodge.xhtml
          sha256: ba61530992f43d9de378837be2dbb56f90dac4c88b17269305fe78519cb15e1c
        expected_sections: 2
        expected_scenes: 5
      - id: bruce_partington_plans
