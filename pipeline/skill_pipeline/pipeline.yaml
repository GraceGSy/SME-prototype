version: canonical-document-pipeline-v1
model: claude-sonnet-5
cache_dir: runs/document-pipeline/cache
output_dir: runs/document-pipeline/results

# Stage order is execution order. A matching implementation is swapped by changing
# its skill and view here; the runner itself contains no matching judgment.
stages:
  - id: extraction
    kind: extract
    skill: extraction
    max_tokens: 32768
  - id: questions
    kind: questions
    skill: questions
  - id: section_matching
    kind: match
    skill: section_matching
    view: sections
    max_tokens: 8192
    validation_attempts: 2
  - id: section_and_subsection_matching
    kind: match
    skill: section_and_subsection_matching
    view: sections_and_subsections
    max_tokens: 8192
    validation_attempts: 3
    source_batch_size: 1

skills:
  extraction: skills/extract-section-and-subsection-paragraphs
  questions: skills/generate-question
  section_matching: skills/directional-section-mapping-by-paragraphs-and-questions
  section_and_subsection_matching: skills/directional-document-mapping-by-paragraphs-nested

study:
  run_root: runs/studies
  site_dir: site/user-study
  datasets:
    sherlock:
      participant_prefix: SH
      label: Sherlock Holmes Stories
    hci:
      participant_prefix: HC
      label: HCI Academic Papers
    legal_opinions:
      participant_prefix: LO
      label: Legal Opinions
    legal_dissents:
      participant_prefix: LD
      label: Legal Dissents

