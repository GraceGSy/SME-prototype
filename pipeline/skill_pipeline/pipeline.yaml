version: canonical-document-pipeline-v1
model: claude-sonnet-5
cache_dir: runs/document-pipeline/cache
output_dir: runs/document-pipeline/results

# Every Skill judgment is exactly one Messages API request. The harness never
# replays Claude's response as a follow-up turn.
execution:
  effort: low
  thinking: disabled
  max_input_tokens: 150000
  max_prompt_characters: 500000
  max_attachment_bytes: 500000
  context_management_trigger_tokens: 50000

# A single command cannot silently issue thousands of individually valid calls.
session_budget:
  max_api_responses: 100
  max_input_tokens: 2000000
  max_output_tokens: 100000

# Stage order is execution order. A matching implementation is swapped by changing
# its skill and view here; the runner itself contains no matching judgment.
stages:
  - id: extraction
    kind: extract
    skill: extraction
    max_tokens: 32768
    execution:
      max_input_tokens: 250000
  - id: questions
    kind: questions
    skill: questions
    max_tokens: 256
    execution:
      max_input_tokens: 100000
      max_prompt_characters: 150000
  - id: section_matching
    kind: match
    skill: section_matching
    view: sections
    max_tokens: 4096
    execution:
      max_input_tokens: 200000
  - id: section_and_subsection_matching
    kind: match
    skill: section_and_subsection_matching
    view: sections_and_subsections
    max_tokens: 2048
    execution:
      # Whole-section evidence intentionally overlaps subsection evidence.
      max_input_tokens: 250000
    source_batch_size: 10

skills:
  extraction: skills/extract-section-and-subsection-paragraphs
  questions: skills/generate-question
  section_matching: skills/directional-section-mapping-by-paragraphs-and-questions
  section_and_subsection_matching: skills/directional-document-mapping-by-paragraphs-nested

study:
  run_root: runs/studies
  site_dir: site/user-study
  datasets:
    sherlock:
      participant_prefix: SH
      label: Sherlock Holmes Stories
    hci:
      participant_prefix: HC
      label: HCI Academic Papers
    legal_opinions:
      participant_prefix: LO
      label: Legal Opinions
    legal_dissents:
      participant_prefix: LD
      label: Legal Dissents

datasets:
  sherlock:
    content_dir: datasets/sherlock/content
    max_granularity: paragraph
    # Start with the first two stories in publication order. Append later IDs
    # here only after the current run has been reviewed.
    question_documents:
      - speckled_band
      - wisteria_lodge
    match_pair: [speckled_band, wisteria_lodge]
    documents:
