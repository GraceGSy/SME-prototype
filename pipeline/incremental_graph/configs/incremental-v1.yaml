schema_version: 1
pipeline_id: incremental-question-graph-v1
prompt_root: ../prompts
context_root: ../contexts
skill_root: ../../../skills

model:
  provider: anthropic
  name: claude-sonnet-5
  # Thinking and the structured answer share this output allowance.
  max_tokens: 4096
  effort: medium
  thinking: adaptive
  max_input_tokens: 200000
  max_prompt_characters: 500000
  context_management_trigger_tokens: 50000
  # Capacity for the five-story corpus when questions run one unit per request.
  max_api_responses_per_process: 3000
  max_session_input_tokens: 30000000
  max_session_output_tokens: 1000000

stages:
  - id: ingest
    handler: ingest_paper
    phase: structural

  - id: section_questions
    handler: generate_section_questions
    phase: structural
    skill: generate-question
    prompt: section-question/v1
    context: section-question
    max_tokens: 2048

  - id: section_matching
    handler: match_sections
    phase: structural
    skill: match-role
    prompts:
      new_to_group: section-to-group-match/v1
      group_to_new: group-to-section-match/v1
    contexts:
      new_to_group: matching
      group_to_new: matching

  - id: section_reconciliation
    handler: reconcile_sections
    phase: structural

  - id: section_group_questions
    handler: generate_section_group_questions
    phase: structural
    skill: generate-question
    prompt: group-question/v1
    context: group-question
    max_tokens: 2048

  - id: section_rerepresentation
    handler: rerepresent_section_singletons
    phase: structural
    skill: match-role
    prompts:
      singleton_to_group: singleton-to-group-match/v1
      group_to_singleton: group-to-singleton-match/v1
    contexts:
      singleton_to_group: matching
      group_to_singleton: matching

  - id: section_rerepresentation_questions
    handler: regenerate_rerepresented_section_questions
    phase: structural
    skill: generate-question
    prompt: group-question/v1
    context: group-question
    max_tokens: 2048

  - id: paragraph_questions
    handler: generate_paragraph_questions
    phase: paragraph
    skill: generate-question
    prompt: paragraph-question/v1
    context: paragraph-question
    max_tokens: 2048
    max_input_tokens: 50000

  - id: paragraph_matching
    handler: match_paragraphs
    phase: paragraph
    skill: match-role
    # Each request compares one focus paragraph against the allowed pool.
    max_input_tokens: 150000
    prompts:
      new_to_group: paragraph-to-group-match/v1
      group_to_new: group-to-paragraph-match/v1
    contexts:
      new_to_group: matching
      group_to_new: matching

  - id: paragraph_reconciliation
    handler: reconcile_paragraphs
    phase: paragraph

  - id: paragraph_group_questions
    handler: generate_paragraph_group_questions
    phase: paragraph
    skill: generate-question
    prompt: group-question/v1
    context: group-question
    max_tokens: 2048
    max_input_tokens: 350000

  - id: paragraph_rerepresentation
    handler: rerepresent_paragraph_singletons
    phase: paragraph
    skill: match-role
    max_input_tokens: 150000
    prompts:
      singleton_to_group: singleton-to-group-match/v1
      group_to_singleton: group-to-singleton-match/v1
    contexts:
      singleton_to_group: matching
      group_to_singleton: matching

  - id: paragraph_rerepresentation_questions
    handler: regenerate_rerepresented_paragraph_questions
    phase: paragraph
    skill: generate-question
    prompt: group-question/v1
    context: group-question
    max_tokens: 2048
    max_input_tokens: 350000
